/* ---------------------------------------------------------------- math ---
   Right-handed frame. X = right, Y = up, Z = backward, so "forward" is -Z.
   Body-frame positions are written with BP(right, up, forward).
   -------------------------------------------------------------------- */
const BP = (r, u, f) => [r, u, -f];

const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: (a) => Math.hypot(a[0], a[1], a[2]),
  len2: (a) => a[0] * a[0] + a[1] * a[1] + a[2] * a[2],
  copy: (a) => [a[0], a[1], a[2]],
  set: (o, a) => { o[0] = a[0]; o[1] = a[1]; o[2] = a[2]; return o; },
  addTo: (o, a) => { o[0] += a[0]; o[1] += a[1]; o[2] += a[2]; return o; },
  mad: (o, a, s) => { o[0] += a[0] * s; o[1] += a[1] * s; o[2] += a[2] * s; return o; },
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]); return l > 1e-12 ? [a[0] / l, a[1] / l, a[2] / l] : [0, 0, 0]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
};

const Q = {
  ident: () => [0, 0, 0, 1],
  mul: (a, b) => [
    a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
    a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
    a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
    a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
  ],
  norm: (q) => { const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return [q[0] / l, q[1] / l, q[2] / l, q[3] / l]; },
  conj: (q) => [-q[0], -q[1], -q[2], q[3]],
  axisAngle: (ax, a) => { const h = a * 0.5, s = Math.sin(h); return [ax[0] * s, ax[1] * s, ax[2] * s, Math.cos(h)]; },
  // rotate a vector from body frame into world frame
  rot: (q, v) => {
    const x = q[0], y = q[1], z = q[2], w = q[3];
    const tx = 2 * (y * v[2] - z * v[1]);
    const ty = 2 * (z * v[0] - x * v[2]);
    const tz = 2 * (x * v[1] - y * v[0]);
    return [v[0] + w * tx + (y * tz - z * ty),
            v[1] + w * ty + (z * tx - x * tz),
            v[2] + w * tz + (x * ty - y * tx)];
  },
  // rotate a vector from world frame into body frame
  inv: (q, v) => Q.rot(Q.conj(q), v),
  // integrate an orientation by a world-frame angular velocity
  integrate: (q, w, dt) => {
    const dq = [w[0] * dt * 0.5, w[1] * dt * 0.5, w[2] * dt * 0.5, 0];
    const m = Q.mul(dq, q);
    return Q.norm([q[0] + m[0], q[1] + m[1], q[2] + m[2], q[3] + m[3]]);
  },
  fromEuler: (yaw, pitch, roll) => {
    const qy = Q.axisAngle([0, 1, 0], yaw);
    const qp = Q.axisAngle([1, 0, 0], pitch);
    const qr = Q.axisAngle([0, 0, 1], roll);
    return Q.norm(Q.mul(Q.mul(qy, qp), qr));
  },
};

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sign = (v) => v < 0 ? -1 : (v > 0 ? 1 : 0);
const smoothstep = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const RPM2RAD = TAU / 60;
const RAD2RPM = 60 / TAU;

/* deterministic pseudo-random: track generation must be reproducible so a
   measured lap time means the same thing in the next session */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ================================================================ TERRAIN
   A height field the bikes can actually change. Four parallel grids:

     h    base height, written once when the track is built
     rut  signed deformation, written by every wheel that passes
     pack how often the ground here has been driven on (a line goes slick)
     surf which material this cell is made of

   Physics reads it through bilinear interpolation; the renderer reads the
   same numbers so what you see is what you hit.
   ======================================================================= */

/* piecewise longitudinal profile: [length, heightAtEnd, shape] */
function shapeFn(shape, t) {
  t = clamp(t, 0, 1);
  switch (shape) {
    case 'lin': return t;
    case 'convex': return 1 - (1 - t) * (1 - t);          // quick rise, flattening
    case 'concave': return t * t;                          // lazy start, steepening
    case 'kick': return t * t * (1.9 - 0.9 * t);           // jump face that kicks at the lip
    case 'knuckle': return Math.pow(t, 1.55);
    default: return smoothstep(t);
  }
}
function profileEval(segs, d) {
  let h0 = 0, x = 0;
  for (let i = 0; i < segs.length; i++) {
    const len = segs[i][0], hEnd = segs[i][1], shape = segs[i][2] || 'smooth';
    if (d <= x + len) {
      const t = len > 1e-6 ? (d - x) / len : 1;
      return h0 + (hEnd - h0) * shapeFn(shape, t);
    }
    x += len; h0 = hEnd;
  }
  return h0;
}
function profileLen(segs) { let L = 0; for (const s of segs) L += s[0]; return L; }

/* ---- the feature catalogue: what a motocross track is actually made of -- */

  stepDown: (h, run, land) => [
    [11.0, h, 'smooth'], [run, h, 'lin'], [1.0, h * 0.55, 'lin'],
    [land, 0, 'convex'], [2.5, 0, 'lin'],
  ],
  roller: (h, len) => [[len * 0.5, h, 'smooth'], [len * 0.5, 0, 'smooth']],
};
function whoopProfile(n, amp, wave) {
  const segs = [];
  for (let i = 0; i < n; i++) {
    const taper = clamp(Math.min(i + 1, n - i) / 1.6, 0.45, 1);
    const a = amp * taper;
    segs.push([wave * 0.5, a, 'smooth']);
    segs.push([wave * 0.5, 0, 'smooth']);
  }
  return segs;
}
function seriesProfile(list) {   // concatenate several features with flat gaps
  const out = [];
  for (const it of list) {
    if (typeof it === 'number') { out.push([it, 0, 'lin']); }
    else for (const s of it) out.push(s);
  }
  return out;
}

/* ------------------------------------------------------- centre line ---- */
function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return [
    0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
    0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
  ];
}

/* Resample a closed waypoint loop into an evenly spaced polyline with
   tangents, normals, curvature and cumulative length. Everything else on
   the track is placed against this arc length. */
function buildPath(way, step) {
  const raw = [];
  const n = way.length;
  for (let i = 0; i < n; i++) {
    const p0 = way[(i - 1 + n) % n], p1 = way[i], p2 = way[(i + 1) % n], p3 = way[(i + 2) % n];
    const seg = Math.max(2, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / step) * 3);
    for (let k = 0; k < seg; k++) raw.push(catmull(p0, p1, p2, p3, k / seg));
  }
  // Walk the dense curve emitting a point every `step` metres. The leftover
  // distance at the end of each dense segment has to be carried into the
  // next one, otherwise nothing ever accumulates and the whole loop
  // collapses to a single sample.
  const pts = [raw[0].slice()];
  let carry = 0;
  for (let i = 1; i <= raw.length; i++) {
    const a = raw[i - 1], b = raw[i % raw.length];
    const segLen = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (segLen < 1e-12) continue;
    let t = 0;
    while (carry + (segLen - t) >= step) {
      t += step - carry;
      const f = t / segLen;
      pts.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]);
      carry = 0;
    }
    carry += segLen - t;
  }
  // the last emitted point may sit almost on top of the first; drop it so the
  // wrap-around spacing stays close to one step
  if (pts.length > 2) {
    const dl = Math.hypot(pts[pts.length - 1][0] - pts[0][0], pts[pts.length - 1][1] - pts[0][1]);
    if (dl < step * 0.5) pts.pop();
  }
  const m = pts.length;
  const tan = new Array(m), nor = new Array(m), curv = new Float32Array(m);
  for (let i = 0; i < m; i++) {
    const a = pts[(i - 1 + m) % m], b = pts[(i + 1) % m];
    let tx = b[0] - a[0], tz = b[1] - a[1];
    const l = Math.hypot(tx, tz) || 1; tx /= l; tz /= l;
    tan[i] = [tx, tz];
    nor[i] = [-tz, tx];             // left of travel
  }
  for (let i = 0; i < m; i++) {
    const a = tan[(i - 1 + m) % m], b = tan[(i + 1) % m];
    const cross = a[0] * b[1] - a[1] * b[0];
    const dot = clamp(a[0] * b[0] + a[1] * b[1], -1, 1);
    curv[i] = Math.atan2(cross, dot) / (2 * step);   // signed 1/m, positive = left
  }
  // light smoothing so a berm does not flicker between samples
  const cs = new Float32Array(m);
  for (let i = 0; i < m; i++) {
    let s = 0, w = 0;
    for (let k = -6; k <= 6; k++) { const ww = 1 - Math.abs(k) / 7; s += curv[(i + k + m) % m] * ww; w += ww; }
    cs[i] = s / w;
  }
  return { pts, tan, nor, curv: cs, step, total: m * step, n: m };
}

/* ------------------------------------------------------- the height field */
const TERR = {
  CS: 0.30,            // cell size in metres — a rut is ~0.5 m wide, so this
                       // is about as coarse as the ground can be and still
                       // hold one.
  nx: 0, nz: 0, x0: 0, z0: 0,
  h: null, rut: null, pack: null, surf: null, pond: null,
  wetGlobal: 0,        // rain soaks the whole track; puddles are `pond`
  path: null, buckets: null, bCS: 6, bnx: 0, bnz: 0,
  built: false, seed: 1,
  dirty: null, dirtyAny: false, chunk: 32, cx: 0, cz: 0,

  alloc(minX, minZ, maxX, maxZ) {
    const m = 18;
    this.x0 = Math.floor((minX - m) / this.CS) * this.CS;
    this.z0 = Math.floor((minZ - m) / this.CS) * this.CS;
    this.nx = Math.ceil((maxX + m - this.x0) / this.CS) + 1;
    this.nz = Math.ceil((maxZ + m - this.z0) / this.CS) + 1;
    const n = this.nx * this.nz;
    this.h = new Float32Array(n);
    this.rut = new Float32Array(n);
    this.pack = new Uint8Array(n);
    this.pond = new Uint8Array(n);
    this.surf = new Uint8Array(n);
    this.wetGlobal = 0;
    this.cx = Math.ceil(this.nx / this.chunk); this.cz = Math.ceil(this.nz / this.chunk);
    this.dirty = new Uint8Array(this.cx * this.cz);
  },
  bytes() {
    return this.h ? this.h.byteLength + this.rut.byteLength + this.pack.byteLength
                  + this.pond.byteLength + this.surf.byteLength : 0;
  },

  /* --- reading ---------------------------------------------------------- */
  gh(ix, iz) {
    if (ix < 0) ix = 0; else if (ix >= this.nx) ix = this.nx - 1;
    if (iz < 0) iz = 0; else if (iz >= this.nz) iz = this.nz - 1;
    const i = iz * this.nx + ix;
    return this.h[i] + this.rut[i];
  },
  height(x, z) {
    const fx = (x - this.x0) / this.CS, fz = (z - this.z0) / this.CS;
    const ix = Math.floor(fx), iz = Math.floor(fz);
    const tx = fx - ix, tz = fz - iz;
    const h00 = this.gh(ix, iz), h10 = this.gh(ix + 1, iz);
    const h01 = this.gh(ix, iz + 1), h11 = this.gh(ix + 1, iz + 1);
    return (h00 * (1 - tx) + h10 * tx) * (1 - tz) + (h01 * (1 - tx) + h11 * tx) * tz;
  },
  normal(x, z) {
    const d = this.CS;
    const hx = this.height(x + d, z) - this.height(x - d, z);
    const hz = this.height(x, z + d) - this.height(x, z - d);
    return V.norm([-hx, 2 * d, -hz]);
  },
  cellAt(x, z) {
    const ix = clamp(Math.round((x - this.x0) / this.CS), 0, this.nx - 1);
    const iz = clamp(Math.round((z - this.z0) / this.CS), 0, this.nz - 1);
    return iz * this.nx + ix;
  },
  wetAt(i) {
    return clamp(this.wetGlobal * (1 + (this.pond[i] / 255) * 2.2), 0, 1.6);
  },
  /* everything the tyre model needs about one spot, in one lookup */
  info(x, z) {
    const i = this.cellAt(x, z);
    const base = SURFACES[this.surf[i]];
    const pk = this.pack[i] / 255, wt = this.wetAt(i);
    const hp = SURFACES[SURF.HARDPACK];
    // a driven-in line polishes towards hard pack — sand never does
    const polish = base.id === SURF.SAND ? 0 : pk * 0.75;
    let grip = lerp(base.grip, hp.grip, polish);
    let roll = lerp(base.roll, hp.roll, pk * 0.6);
    if (wt > 0) {
      const soak = clamp(wt, 0, 1);
      const wetGrip = lerp(base.gripWet, SURFACES[SURF.MUD].grip, clamp(wt - 0.75, 0, 1) * 0.8);
      grip = lerp(grip, wetGrip, soak);
      roll = lerp(roll, roll * 1.55, soak);
    }
    return { surf: base, grip, roll, pack: pk, wet: wt,
             hardness: lerp(base.hardness, 1.0, pk * 0.5), i };
  },

  /* --- where am I on the lap? ------------------------------------------ */
  buildBuckets() {
    const p = this.path;
    const minX = this.x0, minZ = this.z0;
    this.bnx = Math.ceil((this.nx * this.CS) / this.bCS) + 1;
    this.bnz = Math.ceil((this.nz * this.CS) / this.bCS) + 1;
    const cells = new Array(this.bnx * this.bnz);
    for (let i = 0; i < p.n; i++) {
      const bx = Math.floor((p.pts[i][0] - minX) / this.bCS);
      const bz = Math.floor((p.pts[i][1] - minZ) / this.bCS);
      for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
        const cx = bx + dx, cz = bz + dz;
        if (cx < 0 || cz < 0 || cx >= this.bnx || cz >= this.bnz) continue;
        const k = cz * this.bnx + cx;
        (cells[k] || (cells[k] = [])).push(i);
      }
    }
    this.buckets = cells;
  },
  /* nearest point on the centre line: arc length, signed lateral offset
     (positive = left of travel) and the sample index */
  locate(x, z, hint) {
    const p = this.path;
    if (!p) return null;
    let best = -1, bd = 1e18;
    if (hint >= 0) {                       // cheap path: search around last frame
      for (let k = -28; k <= 28; k++) {
        const i = ((hint + k) % p.n + p.n) % p.n;
        const dx = p.pts[i][0] - x, dz = p.pts[i][1] - z;
        const d = dx * dx + dz * dz;
        if (d < bd) { bd = d; best = i; }
      }
      if (bd < 36) return this.finishLocate(x, z, best);
    }
    const bx = Math.floor((x - this.x0) / this.bCS), bz = Math.floor((z - this.z0) / this.bCS);
    if (bx >= 0 && bz >= 0 && bx < this.bnx && bz < this.bnz) {
      const list = this.buckets[bz * this.bnx + bx];
      if (list) for (const i of list) {
        const dx = p.pts[i][0] - x, dz = p.pts[i][1] - z;
        const d = dx * dx + dz * dz;
        if (d < bd) { bd = d; best = i; }
      }
    }
    if (best < 0) {                        // far off track: brute force, rare
      for (let i = 0; i < p.n; i += 3) {
        const dx = p.pts[i][0] - x, dz = p.pts[i][1] - z;
        const d = dx * dx + dz * dz;
        if (d < bd) { bd = d; best = i; }
      }
    }
    return this.finishLocate(x, z, best);
  },
  finishLocate(x, z, i) {
    const p = this.path;
    const dx = x - p.pts[i][0], dz = z - p.pts[i][1];
    const along = dx * p.tan[i][0] + dz * p.tan[i][1];
    const lat = dx * p.nor[i][0] + dz * p.nor[i][1];
    return { i, s: i * p.step + along, lat, dist: Math.hypot(dx, dz) };
  },

  /* --- writing: the ground remembers ------------------------------------ */
  markDirty(ix, iz) {
    const c = Math.floor(iz / this.chunk) * this.cx + Math.floor(ix / this.chunk);
    if (c >= 0 && c < this.dirty.length) { this.dirty[c] = 1; this.dirtyAny = true; }
  },
  /* Cut a rut and push the spoil to the shoulders. Material is roughly
     conserved: what comes out of the groove piles up beside it, which is
     how a berm builds itself over a race. */
  dig(x, z, depth, halfWidth, packAmt) {
    if (depth <= 0 && packAmt <= 0) return 0;
    const CS = this.CS;
    // A rut does not stay tyre-wide: the walls slump as it deepens, so the
    // groove widens with use. This is also what lets the height field hold
    // one at all — a groove narrower than a cell cannot be represented.
    const here = this.cellAt(x, z);
    const Smax = SURFACES[this.surf[here]].rutMax;
    const depthFrac = Smax > 0 ? clamp(-this.rut[here] / Smax, 0, 1) : 0;
    halfWidth = Math.max(halfWidth * (1 + 1.5 * depthFrac), CS * 1.25);
    const outer = halfWidth * 2.6;
    const r = Math.max(1, Math.ceil(outer / CS));
    const cix = Math.round((x - this.x0) / CS), ciz = Math.round((z - this.z0) / CS);
    let removed = 0, shoulderW = 0;
    for (let dz = -r; dz <= r; dz++) {
      for (let dx = -r; dx <= r; dx++) {
        const ix = cix + dx, iz = ciz + dz;
        if (ix < 0 || iz < 0 || ix >= this.nx || iz >= this.nz) continue;
        const d = Math.hypot(dx, dz) * CS;
        const i = iz * this.nx + ix;
        const S = SURFACES[this.surf[i]];
        if (d <= halfWidth) {
          if (packAmt > 0) {
            const w = 1 - 0.6 * (d / halfWidth);
            this.pack[i] = Math.min(255, this.pack[i] + packAmt * w * 255);
          }
          if (S.rutMax > 0 && depth > 0) {
            const w = 1 - 0.75 * (d / halfWidth) * (d / halfWidth);
            const cut = depth * w * S.rutRate;
            const room = Math.max(0, S.rutMax + this.rut[i]);
            const take = Math.min(cut, room);
            if (take > 0) { this.rut[i] -= take; removed += take; this.markDirty(ix, iz); }
          }
        } else if (d <= outer) {
          shoulderW += 1 - (d - halfWidth) / (outer - halfWidth);
        }
      }
    }
    if (removed > 0 && shoulderW > 0) {
      const per = (removed * 0.70) / shoulderW;
      for (let dz = -r; dz <= r; dz++) {
        for (let dx = -r; dx <= r; dx++) {
          const ix = cix + dx, iz = ciz + dz;
          if (ix < 0 || iz < 0 || ix >= this.nx || iz >= this.nz) continue;
          const d = Math.hypot(dx, dz) * CS;
          if (d > halfWidth && d <= outer) {
            const i = iz * this.nx + ix;
            const w = 1 - (d - halfWidth) / (outer - halfWidth);
            this.rut[i] += per * w; this.markDirty(ix, iz);
          }
        }
      }
    }
    return removed;
  },
  /* rain soaks in, sun dries it out — one number, no grid walk per frame */
  soak(dt, rainRate, dryRate) {
    this.wetGlobal = clamp(this.wetGlobal + (rainRate - dryRate) * dt, 0, 1);
  },
};

/* ------------------------------------------------------------- builder --- */
function keyLerp(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const a = keys[i - 1], b = keys[i];
      const f = (t - a[0]) / Math.max(1e-9, b[0] - a[0]);
      return a[1] + (b[1] - a[1]) * smoothstep(f);
    }
  }
  return keys[keys.length - 1][1];
}
function valueNoise2(seed) {
  const rnd = mulberry32(seed);
  const P = new Float32Array(256 * 256);
  for (let i = 0; i < P.length; i++) P[i] = rnd();
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const tx = smoothstep(x - xi), ty = smoothstep(y - yi);
    const g = (a, b) => P[(((a & 255) * 256) + (b & 255))];
    const a = g(xi, yi), b = g(xi + 1, yi), c = g(xi, yi + 1), d = g(xi + 1, yi + 1);
    return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
  };
}

function buildTrack(def, seed) {
  seed = seed || 12345;
  TERR.seed = seed;
  const sc = def.scale || 1;
  const way = def.way.map(p => [p[0] * sc, p[1] * sc]);
  const path = buildPath(way, 0.25);
  const total = path.total;

  let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
  for (const p of path.pts) {
    if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
    if (p[1] < minZ) minZ = p[1]; if (p[1] > maxZ) maxZ = p[1];
  }
  TERR.alloc(minX - 22, minZ - 22, maxX + 22, maxZ + 22);
  TERR.path = path;
  TERR.buildBuckets();

  // ---- ambient ground: rolling grass, before the track cuts into it
  const nz1 = valueNoise2(seed), nz2 = valueNoise2(seed + 977);
  const amb = (x, z) => (nz1(x / 52, z / 52) - 0.5) * 8.5 + (nz2(x / 15, z / 15) - 0.5) * 1.2
                      + (nz1(x / 6, z / 6) - 0.5) * 0.24;
  for (let iz = 0; iz < TERR.nz; iz++) {
    for (let ix = 0; ix < TERR.nx; ix++) {
      const x = TERR.x0 + ix * TERR.CS, z = TERR.z0 + iz * TERR.CS;
      const i = iz * TERR.nx + ix;
      TERR.h[i] = amb(x, z);
      TERR.surf[i] = SURF.GRASS;
    }
  }

  // ---- per-sample track data
  const m = path.n;
  const sElev = new Float32Array(m), sWidth = new Float32Array(m);
  const sFeat = new Float32Array(m), sSurf = new Uint8Array(m), sBerm = new Float32Array(m);
  for (let i = 0; i < m; i++) {
    const f = (i * path.step) / total;
    sElev[i] = keyLerp(def.elev, f);
    sWidth[i] = keyLerp(def.width, f) * 0.5;
    sSurf[i] = SURF.SOFT;
    sBerm[i] = 1;
  }
  for (const r of (def.regions || [])) {
    for (let i = 0; i < m; i++) { const f = (i * path.step) / total; if (f >= r.from && f < r.to) sSurf[i] = r.surf; }
  }
  for (const r of (def.bermScale || [])) {
    for (let i = 0; i < m; i++) { const f = (i * path.step) / total; if (f >= r.from && f < r.to) sBerm[i] = r.scale; }
  }
  // features: stamp their longitudinal profile onto the sample elevation
  const featSpans = [];
  for (const ft of (def.features || [])) {
    const segs = ft.prof();
    const L = profileLen(segs);
    const s0 = ft.atF !== undefined ? ft.atF * total : ft.at;
    featSpans.push({ name: ft.name, s0, s1: s0 + L, len: L });
    const i0 = Math.floor(s0 / path.step), i1 = Math.ceil((s0 + L) / path.step);
    for (let i = i0; i <= i1; i++) {
      const ii = ((i % m) + m) % m;
      const d = i * path.step - s0;
      if (d < 0 || d > L) continue;
      sFeat[ii] += profileEval(segs, d);
    }
  }

  // ---- stamp the track into the ambient ground
  const ST = TERR.CS * 0.5;
  const rnd = mulberry32(seed + 5551);
  const micro = valueNoise2(seed + 31);
  for (let i = 0; i < m; i++) {
    const c = path.pts[i], nrm = path.nor[i];
    const w = sWidth[i];
    const f = (i * path.step) / total;
    const curv = path.curv[i];
    const outSign = curv > 0 ? -1 : 1;           // outside of the turn
    const bermH = Math.min(1.15, Math.abs(curv) * 34) * sBerm[i];
    const bermW = clamp(w * 0.55, 1.6, 4.2);
    let rutN = 0;
    for (const r of (def.preRuts || [])) if (f >= r.from && f < r.to) rutN = r.n;
    const ext = 5.5;
    for (let lat = -(w + ext); lat <= w + ext; lat += ST) {
      const x = c[0] + nrm[0] * lat, z = c[1] + nrm[1] * lat;
      const ix = Math.round((x - TERR.x0) / TERR.CS), iz = Math.round((z - TERR.z0) / TERR.CS);
      if (ix < 0 || iz < 0 || ix >= TERR.nx || iz >= TERR.nz) continue;
      const gi = iz * TERR.nx + ix;
      const al = Math.abs(lat);
      const inside = al <= w;
      const weight = inside ? 1 : 1 - smoothstep((al - w) / ext);
      if (weight <= 0.001) continue;

      let hh = sElev[i] + sFeat[i];
      if (bermH > 0 && lat * outSign > 0) {
        const t = clamp((al - (w - bermW)) / bermW, 0, 1.35);
        hh += bermH * t * t * (1 + 0.25 * (t > 1 ? t - 1 : 0));
      }
      hh += 0.10 * smoothstep((al - (w - 0.9)) / 1.1);
      if (rutN > 0 && inside) {
        const lane = (lat / (w * 0.72)) * rutN * Math.PI;
        hh += -0.085 * Math.pow(Math.max(0, Math.cos(lane)), 6);
      }
      hh += (micro(x / 2.4, z / 2.4) - 0.5) * 0.055 * weight;

      TERR.h[gi] = TERR.h[gi] * (1 - weight) + hh * weight;
      if (weight > 0.5) TERR.surf[gi] = sSurf[i];
      else if (weight > 0.12 && TERR.surf[gi] === SURF.GRASS && rnd() < 0.4) TERR.surf[gi] = SURF.GRAVEL;
      if (inside) TERR.pack[gi] = Math.max(TERR.pack[gi], Math.round(90 * (1 - al / w)));
    }
  }

  // ---- where water will stand: a cell lower than everything around it
  for (let iz = 1; iz < TERR.nz - 1; iz++) {
    for (let ix = 1; ix < TERR.nx - 1; ix++) {
      const i = iz * TERR.nx + ix;
      const h0 = TERR.h[i];
      let higher = 0, sum = 0;
      for (let k = 0; k < 8; k++) {
        const dx = [1, -1, 0, 0, 1, 1, -1, -1][k], dz = [0, 0, 1, -1, 1, -1, 1, -1][k];
        const hn = TERR.h[i + dz * TERR.nx + dx];
        sum += hn - h0;
        if (hn > h0 + 0.012) higher++;
      }
      if (higher >= 6) TERR.pond[i] = Math.min(255, Math.round((sum / 8) * 900));
    }
  }

  TERR.built = true;
  TERR.dirty.fill(1); TERR.dirtyAny = true;
  return { path, total, featSpans, def, scale: sc };
}
