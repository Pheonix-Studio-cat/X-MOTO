/* ---------------------------------------------------------------- math ---
   Right-handed frame. X = right, Y = up, Z = backward, so "forward" is -Z.
   Body-frame positions are written with BP(right, up, forward).
   -------------------------------------------------------------------- */
const BP = (r, u, f) => [r, u, -f];

const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: (a) => Math.hypot(a[0], a[1], a[2]),
  len2: (a) => a[0] * a[0] + a[1] * a[1] + a[2] * a[2],
  copy: (a) => [a[0], a[1], a[2]],
  set: (o, a) => { o[0] = a[0]; o[1] = a[1]; o[2] = a[2]; return o; },
  addTo: (o, a) => { o[0] += a[0]; o[1] += a[1]; o[2] += a[2]; return o; },
  mad: (o, a, s) => { o[0] += a[0] * s; o[1] += a[1] * s; o[2] += a[2] * s; return o; },
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]); return l > 1e-12 ? [a[0] / l, a[1] / l, a[2] / l] : [0, 0, 0]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
};

const Q = {
  ident: () => [0, 0, 0, 1],
  mul: (a, b) => [
    a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
    a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
    a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
    a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
  ],
  norm: (q) => { const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return [q[0] / l, q[1] / l, q[2] / l, q[3] / l]; },
  conj: (q) => [-q[0], -q[1], -q[2], q[3]],
  axisAngle: (ax, a) => { const h = a * 0.5, s = Math.sin(h); return [ax[0] * s, ax[1] * s, ax[2] * s, Math.cos(h)]; },
  // rotate a vector from body frame into world frame
  rot: (q, v) => {
    const x = q[0], y = q[1], z = q[2], w = q[3];
    const tx = 2 * (y * v[2] - z * v[1]);
    const ty = 2 * (z * v[0] - x * v[2]);
    const tz = 2 * (x * v[1] - y * v[0]);
    return [v[0] + w * tx + (y * tz - z * ty),
            v[1] + w * ty + (z * tx - x * tz),
            v[2] + w * tz + (x * ty - y * tx)];
  },
  // rotate a vector from world frame into body frame
  inv: (q, v) => Q.rot(Q.conj(q), v),
  // integrate an orientation by a world-frame angular velocity
  integrate: (q, w, dt) => {
    const dq = [w[0] * dt * 0.5, w[1] * dt * 0.5, w[2] * dt * 0.5, 0];
    const m = Q.mul(dq, q);
    return Q.norm([q[0] + m[0], q[1] + m[1], q[2] + m[2], q[3] + m[3]]);
  },
  fromEuler: (yaw, pitch, roll) => {
    const qy = Q.axisAngle([0, 1, 0], yaw);
    const qp = Q.axisAngle([1, 0, 0], pitch);
    const qr = Q.axisAngle([0, 0, 1], roll);
    return Q.norm(Q.mul(Q.mul(qy, qp), qr));
  },
};

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sign = (v) => v < 0 ? -1 : (v > 0 ? 1 : 0);
const smoothstep = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const RPM2RAD = TAU / 60;
const RAD2RPM = 60 / TAU;

/* deterministic pseudo-random: track generation must be reproducible so a
   measured lap time means the same thing in the next session */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ================================================================ TERRAIN
   A height field the bikes can actually change. Four parallel grids:

     h    base height, written once when the track is built
     rut  signed deformation, written by every wheel that passes
     pack how often the ground here has been driven on (a line goes slick)
     surf which material this cell is made of

   Physics reads it through bilinear interpolation; the renderer reads the
   same numbers so what you see is what you hit.
   ======================================================================= */

/* piecewise longitudinal profile: [length, heightAtEnd, shape] */
function shapeFn(shape, t) {
  t = clamp(t, 0, 1);
  switch (shape) {
    case 'lin': return t;
    case 'convex': return 1 - (1 - t) * (1 - t);          // quick rise, flattening
    case 'concave': return t * t;                          // lazy start, steepening
    case 'kick': return t * t * (1.9 - 0.9 * t);           // jump face that kicks at the lip
    case 'knuckle': return Math.pow(t, 1.55);
    default: return smoothstep(t);
  }
}
function profileEval(segs, d) {
  let h0 = 0, x = 0;
  for (let i = 0; i < segs.length; i++) {
    const len = segs[i][0], hEnd = segs[i][1], shape = segs[i][2] || 'smooth';
    if (d <= x + len) {
      const t = len > 1e-6 ? (d - x) / len : 1;
      return h0 + (hEnd - h0) * shapeFn(shape, t);
    }
    x += len; h0 = hEnd;
  }
  return h0;
}
function profileLen(segs) { let L = 0; for (const s of segs) L += s[0]; return L; }

/* ---- the feature catalogue: what a motocross track is actually made of -- */

  stepDown: (h, run, land) => [

    [land, 0, 'convex'], [2.5, 0, 'lin'],
  ],
  roller: (h, len) => [[len * 0.5, h, 'smooth'], [len * 0.5, 0, 'smooth']],
};
function whoopProfile(n, amp, wave) {
  const segs = [];
  for (let i = 0; i < n; i++) {
    const taper = clamp(Math.min(i + 1, n - i) / 1.6, 0.45, 1);
    const a = amp * taper;
    segs.push([wave * 0.5, a, 'smooth']);
    segs.push([wave * 0.5, 0, 'smooth']);
  }
  return segs;
}
function seriesProfile(list) {   // concatenate several features with flat gaps
  const out = [];
  for (const it of list) {
    if (typeof it === 'number') { out.push([it, 0, 'lin']); }
    else for (const s of it) out.push(s);
  }
  return out;
}

/* ------------------------------------------------------- centre line ---- */
function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return [
    0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
    0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
  ];
}

/* Resample a closed waypoint loop into an evenly spaced polyline with
   tangents, normals, curvature and cumulative length. Everything else on
   the track is placed against this arc length. */
function buildPath(way, step) {
  const raw = [];
  const n = way.length;
  for (let i = 0; i < n; i++) {
    const p0 = way[(i - 1 + n) % n], p1 = way[i], p2 = way[(i + 1) % n], p3 = way[(i + 2) % n];
    const seg = Math.max(2, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / step) * 3);
    for (let k = 0; k < seg; k++) raw.push(catmull(p0, p1, p2, p3, k / seg));
  }
  // Walk the dense curve emitting a point every `step` metres. The leftover
  // distance at the end of each dense segment has to be carried into the
  // next one, otherwise nothing ever accumulates and the whole loop
  // collapses to a single sample.
  const pts = [raw[0].slice()];
  let carry = 0;
  for (let i = 1; i <= raw.length; i++) {
    const a = raw[i - 1], b = raw[i % raw.length];
    const segLen = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (segLen < 1e-12) continue;
    let t = 0;
    while (carry + (segLen - t) >= step) {
      t += step - carry;
      const f = t / segLen;
      pts.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]);
      carry = 0;
    }
    carry += segLen - t;
  }
  // the last emitted point may sit almost on top of the first; drop it so the
  // wrap-around spacing stays close to one step
  if (pts.length > 2) {
    const dl = Math.hypot(pts[pts.length - 1][0] - pts[0][0], pts[pts.length - 1][1] - pts[0][1]);
    if (dl < step * 0.5) pts.pop();
  }
  const m = pts.length;
  const tan = new Array(m), nor = new Array(m), curv = new Float32Array(m);
  for (let i = 0; i < m; i++) {
    const a = pts[(i - 1 + m) % m], b = pts[(i + 1) % m];
    let tx = b[0] - a[0], tz = b[1] - a[1];
    const l = Math.hypot(tx, tz) || 1; tx /= l; tz /= l;
    tan[i] = [tx, tz];
    nor[i] = [-tz, tx];             // left of travel
  }
  for (let i = 0; i < m; i++) {
    const a = tan[(i - 1 + m) % m], b = tan[(i + 1) % m];
    const cross = a[0] * b[1] - a[1] * b[0];
    const dot = clamp(a[0] * b[0] + a[1] * b[1], -1, 1);
    curv[i] = Math.atan2(cross, dot) / (2 * step);   // signed 1/m, positive = left
  }
  // light smoothing so a berm does not flicker between samples
  const cs = new Float32Array(m);
  for (let i = 0; i < m; i++) {
    let s = 0, w = 0;
    for (let k = -6; k <= 6; k++) { const ww = 1 - Math.abs(k) / 7; s += curv[(i + k + m) % m] * ww; w += ww; }
    cs[i] = s / w;
  }
  return { pts, tan, nor, curv: cs, step, total: m * step, n: m };
}

/* ------------------------------------------------------- the height field */
const TERR = {
  CS: 0.30,            // cell size in metres — a rut is ~0.5 m wide, so this
                       // is about as coarse as the ground can be and still
                       // hold one.
  nx: 0, nz: 0, x0: 0, z0: 0,
  h: null, rut: null, pack: null, surf: null, pond: null,
  wetGlobal: 0,        // rain soaks the whole track; puddles are `pond`
  path: null, buckets: null, bCS: 6, bnx: 0, bnz: 0,
  built: false, seed: 1,
  dirty: null, dirtyAny: false, chunk: 32, cx: 0, cz: 0,

  alloc(minX, minZ, maxX, maxZ) {
    const m = 18;
    this.x0 = Math.floor((minX - m) / this.CS) * this.CS;
    this.z0 = Math.floor((minZ - m) / this.CS) * this.CS;
    this.nx = Math.ceil((maxX + m - this.x0) / this.CS) + 1;
    this.nz = Math.ceil((maxZ + m - this.z0) / this.CS) + 1;
    const n = this.nx * this.nz;
    /* Fail loudly. A test once asked for a 4 km square of 0.30 m cells:
       181 million of them, two gigabytes, and no error — just a run that
       never finished. */
    if (n > 32e6) throw new Error('terrain grid too large: ' + this.nx + ' x ' + this.nz +
      ' = ' + (n / 1e6).toFixed(1) + ' M cells');
    this.h = new Float32Array(n);
    this.rut = new Float32Array(n);
    this.pack = new Uint8Array(n);
    this.pond = new Uint8Array(n);
    this.surf = new Uint8Array(n);
    this.wetGlobal = 0;
    this.cx = Math.ceil(this.nx / this.chunk); this.cz = Math.ceil(this.nz / this.chunk);
    this.dirty = new Uint8Array(this.cx * this.cz);
  },
  bytes() {
    return this.h ? this.h.byteLength + this.rut.byteLength + this.pack.byteLength
                  + this.pond.byteLength + this.surf.byteLength : 0;
  },

  /* --- reading ---------------------------------------------------------- */
  gh(ix, iz) {
    if (ix < 0) ix = 0; else if (ix >= this.nx) ix = this.nx - 1;
    if (iz < 0) iz = 0; else if (iz >= this.nz) iz = this.nz - 1;
    const i = iz * this.nx + ix;
    return this.h[i] + this.rut[i];
  },
  height(x, z) {
    const fx = (x - this.x0) / this.CS, fz = (z - this.z0) / this.CS;
    const ix = Math.floor(fx), iz = Math.floor(fz);
    const tx = fx - ix, tz = fz - iz;
    const h00 = this.gh(ix, iz), h10 = this.gh(ix + 1, iz);
    const h01 = this.gh(ix, iz + 1), h11 = this.gh(ix + 1, iz + 1);
    return (h00 * (1 - tx) + h10 * tx) * (1 - tz) + (h01 * (1 - tx) + h11 * tx) * tz;
  },
  normal(x, z) {
    const d = this.CS;
    const hx = this.height(x + d, z) - this.height(x - d, z);
    const hz = this.height(x, z + d) - this.height(x, z - d);
    return V.norm([-hx, 2 * d, -hz]);
  },
  cellAt(x, z) {
    const ix = clamp(Math.round((x - this.x0) / this.CS), 0, this.nx - 1);
    const iz = clamp(Math.round((z - this.z0) / this.CS), 0, this.nz - 1);
    return iz * this.nx + ix;
  },
  wetAt(i) {
    return clamp(this.wetGlobal * (1 + (this.pond[i] / 255) * 2.2), 0, 1.6);
  },
  /* everything the tyre model needs about one spot, in one lookup */
  info(x, z) {
    const i = this.cellAt(x, z);
    const base = SURFACES[this.surf[i]];
    const pk = this.pack[i] / 255, wt = this.wetAt(i);
    const hp = SURFACES[SURF.HARDPACK];
    /* A driven-in line polishes towards THIS material's packed value, not
       towards hard pack. Loam turns into a slick blue groove and mud gets
       slipperier still; only sand refuses to pack at all. Sending every
       surface towards hard pack made a muddy track grippier the more it
       was ridden, and a bike stopped shorter in mud than on hard pack. */
    const polish = base.id === SURF.SAND ? 0 : pk * 0.80;
    let grip = lerp(base.grip, base.gripPacked, polish);
    let roll = lerp(base.roll, hp.roll, pk * 0.6);
    if (wt > 0) {
      const soak = clamp(wt, 0, 1);
      const wetGrip = lerp(base.gripWet, SURFACES[SURF.MUD].grip, clamp(wt - 0.75, 0, 1) * 0.8);
      grip = lerp(grip, wetGrip, soak);
      roll = lerp(roll, roll * 1.55, soak);
    }
    return { surf: base, grip, roll, pack: pk, wet: wt,
             hardness: lerp(base.hardness, 1.0, pk * 0.5), i };
  },

  /* --- where am I on the lap? ------------------------------------------ */
  buildBuckets() {
    const p = this.path;
    const minX = this.x0, minZ = this.z0;
    this.bnx = Math.ceil((this.nx * this.CS) / this.bCS) + 1;
    this.bnz = Math.ceil((this.nz * this.CS) / this.bCS) + 1;
    const cells = new Array(this.bnx * this.bnz);
    for (let i = 0; i < p.n; i++) {
      const bx = Math.floor((p.pts[i][0] - minX) / this.bCS);
      const bz = Math.floor((p.pts[i][1] - minZ) / this.bCS);
      for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
        const cx = bx + dx, cz = bz + dz;
        if (cx < 0 || cz < 0 || cx >= this.bnx || cz >= this.bnz) continue;
        const k = cz * this.bnx + cx;
        (cells[k] || (cells[k] = [])).push(i);
      }
    }
    this.buckets = cells;
  },
  /* nearest point on the centre line: arc length, signed lateral offset
     (positive = left of travel) and the sample index */
  locate(x, z, hint) {
    const p = this.path;
    if (!p) return null;
    let best = -1, bd = 1e18;
    if (hint >= 0) {                       // cheap path: search around last frame
      for (let k = -28; k <= 28; k++) {
        const i = ((hint + k) % p.n + p.n) % p.n;
        const dx = p.pts[i][0] - x, dz = p.pts[i][1] - z;
        const d = dx * dx + dz * dz;
        if (d < bd) { bd = d; best = i; }
      }
      if (bd < 36) return this.finishLocate(x, z, best);
    }
    const bx = Math.floor((x - this.x0) / this.bCS), bz = Math.floor((z - this.z0) / this.bCS);
    if (bx >= 0 && bz >= 0 && bx < this.bnx && bz < this.bnz) {
      const list = this.buckets[bz * this.bnx + bx];
      if (list) for (const i of list) {
        const dx = p.pts[i][0] - x, dz = p.pts[i][1] - z;
        const d = dx * dx + dz * dz;
        if (d < bd) { bd = d; best = i; }
      }
    }
    if (best < 0) {                        // far off track: brute force, rare
      for (let i = 0; i < p.n; i += 3) {
        const dx = p.pts[i][0] - x, dz = p.pts[i][1] - z;
        const d = dx * dx + dz * dz;
        if (d < bd) { bd = d; best = i; }
      }
    }
    return this.finishLocate(x, z, best);
  },
  finishLocate(x, z, i) {
    const p = this.path;
    const dx = x - p.pts[i][0], dz = z - p.pts[i][1];
    const along = dx * p.tan[i][0] + dz * p.tan[i][1];
    const lat = dx * p.nor[i][0] + dz * p.nor[i][1];
    return { i, s: i * p.step + along, lat, dist: Math.hypot(dx, dz) };
  },

  /* --- writing: the ground remembers ------------------------------------ */
  markDirty(ix, iz) {
    const c = Math.floor(iz / this.chunk) * this.cx + Math.floor(ix / this.chunk);
    if (c >= 0 && c < this.dirty.length) { this.dirty[c] = 1; this.dirtyAny = true; }
  },
  /* Cut a rut and push the spoil to the SIDES of it. Direction matters:
     spreading the spoil evenly in a circle piles it up in front of the
     wheel as well, the wheel climbs its own ridge on the next cell, and a
     flat field of loam turns into a washboard that shakes the bike apart
     in two seconds. A real rut has berms along its edges and nothing
     across it. Material is otherwise conserved, which is how a berm
     builds itself over a race. */
  dig(x, z, hx, hz, depth, halfWidth, packAmt) {
    if (depth <= 0 && packAmt <= 0) return 0;
    const CS = this.CS;
    const hl = Math.hypot(hx, hz);
    if (hl < 1e-6) { hx = 1; hz = 0; } else { hx /= hl; hz /= hl; }
    // the walls slump as the groove deepens, so it widens with use — and
    // a groove narrower than a cell cannot be held by the height field
    const here = this.cellAt(x, z);
    const Smax = SURFACES[this.surf[here]].rutMax;
    const depthFrac = Smax > 0 ? clamp(-this.rut[here] / Smax, 0, 1) : 0;
    halfWidth = Math.max(halfWidth * (1 + 1.5 * depthFrac), CS * 1.25);
    const eAlong = halfWidth * 2.4;          // the cut is smeared along the path
    const outer = halfWidth * 2.6;
    const r = Math.max(1, Math.ceil(Math.max(outer, eAlong) / CS));
    const cix = Math.round((x - this.x0) / CS), ciz = Math.round((z - this.z0) / CS);
    let removed = 0, shoulderW = 0;
    const shoulders = [];
    for (let dz = -r; dz <= r; dz++) {
      for (let dx = -r; dx <= r; dx++) {
        const ix = cix + dx, iz = ciz + dz;
        if (ix < 0 || iz < 0 || ix >= this.nx || iz >= this.nz) continue;
        const mx = dx * CS, mz = dz * CS;
        const along = mx * hx + mz * hz;
        const lat = -mx * hz + mz * hx;
        const i = iz * this.nx + ix;
        const S = SURFACES[this.surf[i]];
        const q = (along / eAlong) * (along / eAlong) + (lat / halfWidth) * (lat / halfWidth);
        if (q <= 1) {
          if (packAmt > 0) {
            const w = 1 - 0.6 * q;
            this.pack[i] = Math.min(255, this.pack[i] + packAmt * w * 255);
          }
          if (S.rutMax > 0 && depth > 0) {
            const w = 1 - 0.75 * q;
            const cut = depth * w * S.rutRate;
            const room = Math.max(0, S.rutMax + this.rut[i]);
            const take = Math.min(cut, room);
            if (take > 0) { this.rut[i] -= take; removed += take; this.markDirty(ix, iz); }
          }
        } else if (Math.abs(lat) > halfWidth && Math.abs(lat) <= outer && Math.abs(along) <= eAlong) {
          const w = (1 - (Math.abs(lat) - halfWidth) / (outer - halfWidth))
                  * (1 - 0.5 * Math.abs(along) / eAlong);
          if (w > 0) { shoulders.push([i, ix, iz, w]); shoulderW += w; }
        }
      }
    }
    if (removed > 0 && shoulderW > 0) {
      const per = (removed * 0.70) / shoulderW;
      for (const sh of shoulders) {
        const i = sh[0];
        // Spoil compacts and slumps: a ridge cannot grow for ever. Without
        // a ceiling, a bike circling the same ground builds walls it then
        // launches itself off.
        const capUp = SURFACES[this.surf[i]].rutMax * 0.45;
        this.rut[i] = Math.min(capUp, this.rut[i] + per * sh[3]);
        this.markDirty(sh[1], sh[2]);
      }
    }
    return removed;
  },

  /* rain soaks in, sun dries it out — one number, no grid walk per frame */
  soak(dt, rainRate, dryRate) {
    this.wetGlobal = clamp(this.wetGlobal + (rainRate - dryRate) * dt, 0, 1);
  },
};

/* ------------------------------------------------------------- builder --- */
function keyLerp(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const a = keys[i - 1], b = keys[i];
      const f = (t - a[0]) / Math.max(1e-9, b[0] - a[0]);
      return a[1] + (b[1] - a[1]) * smoothstep(f);
    }
  }
  return keys[keys.length - 1][1];
}
function valueNoise2(seed) {
  const rnd = mulberry32(seed);
  const P = new Float32Array(256 * 256);
  for (let i = 0; i < P.length; i++) P[i] = rnd();
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const tx = smoothstep(x - xi), ty = smoothstep(y - yi);
    const g = (a, b) => P[(((a & 255) * 256) + (b & 255))];
    const a = g(xi, yi), b = g(xi + 1, yi), c = g(xi, yi + 1), d = g(xi + 1, yi + 1);
    return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
  };
}

function buildTrack(def, seed) {
  seed = seed || 12345;
  TERR.seed = seed;
  const sc = def.scale || 1;
  const way = def.way.map(p => [p[0] * sc, p[1] * sc]);
  const path = buildPath(way, 0.25);
  const total = path.total;

  let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
  for (const p of path.pts) {
    if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
    if (p[1] < minZ) minZ = p[1]; if (p[1] > maxZ) maxZ = p[1];
  }
  TERR.alloc(minX - 22, minZ - 22, maxX + 22, maxZ + 22);
  TERR.path = path;
  TERR.buildBuckets();

  // ---- ambient ground: rolling grass, before the track cuts into it
  const nz1 = valueNoise2(seed), nz2 = valueNoise2(seed + 977);
  const amb = (x, z) => (nz1(x / 52, z / 52) - 0.5) * 8.5 + (nz2(x / 15, z / 15) - 0.5) * 1.2
                      + (nz1(x / 6, z / 6) - 0.5) * 0.24;
  for (let iz = 0; iz < TERR.nz; iz++) {
    for (let ix = 0; ix < TERR.nx; ix++) {
      const x = TERR.x0 + ix * TERR.CS, z = TERR.z0 + iz * TERR.CS;
      const i = iz * TERR.nx + ix;
      TERR.h[i] = amb(x, z);
      TERR.surf[i] = SURF.GRASS;
    }
  }

  // ---- per-sample track data
  const m = path.n;
  const sElev = new Float32Array(m), sWidth = new Float32Array(m);
  const sFeat = new Float32Array(m), sSurf = new Uint8Array(m), sBerm = new Float32Array(m);
  for (let i = 0; i < m; i++) {
    const f = (i * path.step) / total;
    sElev[i] = keyLerp(def.elev, f);
    sWidth[i] = keyLerp(def.width, f) * 0.5;
    sSurf[i] = SURF.SOFT;
    sBerm[i] = 1;
  }
  for (const r of (def.regions || [])) {
    for (let i = 0; i < m; i++) { const f = (i * path.step) / total; if (f >= r.from && f < r.to) sSurf[i] = r.surf; }
  }
  for (const r of (def.bermScale || [])) {
    for (let i = 0; i < m; i++) { const f = (i * path.step) / total; if (f >= r.from && f < r.to) sBerm[i] = r.scale; }
  }
  // features: stamp their longitudinal profile onto the sample elevation
  const featSpans = [];
  for (const ft of (def.features || [])) {
    const segs = ft.prof();
    const L = profileLen(segs);
    const s0 = ft.atF !== undefined ? ft.atF * total : ft.at;
    featSpans.push({ name: ft.name, s0, s1: s0 + L, len: L });
    const i0 = Math.floor(s0 / path.step), i1 = Math.ceil((s0 + L) / path.step);
    for (let i = i0; i <= i1; i++) {
      const ii = ((i % m) + m) % m;
      const d = i * path.step - s0;
      if (d < 0 || d > L) continue;
      sFeat[ii] += profileEval(segs, d);
    }
  }

  // ---- stamp the track into the ambient ground
  const ST = TERR.CS * 0.5;
  const rnd = mulberry32(seed + 5551);
  const micro = valueNoise2(seed + 31);
  for (let i = 0; i < m; i++) {
    const c = path.pts[i], nrm = path.nor[i];
    const w = sWidth[i];
    const f = (i * path.step) / total;
    const curv = path.curv[i];
    const outSign = curv > 0 ? -1 : 1;           // outside of the turn
    const bermH = Math.min(1.15, Math.abs(curv) * 34) * sBerm[i];
    const bermW = clamp(w * 0.55, 1.6, 4.2);
    let rutN = 0;
    for (const r of (def.preRuts || [])) if (f >= r.from && f < r.to) rutN = r.n;
    const ext = 5.5;
    for (let lat = -(w + ext); lat <= w + ext; lat += ST) {
      const x = c[0] + nrm[0] * lat, z = c[1] + nrm[1] * lat;
      const ix = Math.round((x - TERR.x0) / TERR.CS), iz = Math.round((z - TERR.z0) / TERR.CS);
      if (ix < 0 || iz < 0 || ix >= TERR.nx || iz >= TERR.nz) continue;
      const gi = iz * TERR.nx + ix;
      const al = Math.abs(lat);
      const inside = al <= w;
      const weight = inside ? 1 : 1 - smoothstep((al - w) / ext);
      if (weight <= 0.001) continue;

      let hh = sElev[i] + sFeat[i];
      if (bermH > 0 && lat * outSign > 0) {
        const t = clamp((al - (w - bermW)) / bermW, 0, 1.35);
        hh += bermH * t * t * (1 + 0.25 * (t > 1 ? t - 1 : 0));
      }
      hh += 0.10 * smoothstep((al - (w - 0.9)) / 1.1);
      if (rutN > 0 && inside) {
        const lane = (lat / (w * 0.72)) * rutN * Math.PI;
        hh += -0.085 * Math.pow(Math.max(0, Math.cos(lane)), 6);
      }
      hh += (micro(x / 2.4, z / 2.4) - 0.5) * 0.055 * weight;

      TERR.h[gi] = TERR.h[gi] * (1 - weight) + hh * weight;
      if (weight > 0.5) TERR.surf[gi] = sSurf[i];
      else if (weight > 0.12 && TERR.surf[gi] === SURF.GRASS && rnd() < 0.4) TERR.surf[gi] = SURF.GRAVEL;
      if (inside) TERR.pack[gi] = Math.max(TERR.pack[gi], Math.round(90 * (1 - al / w)));
    }
  }

  // ---- where water will stand: a cell lower than everything around it
  for (let iz = 1; iz < TERR.nz - 1; iz++) {
    for (let ix = 1; ix < TERR.nx - 1; ix++) {
      const i = iz * TERR.nx + ix;
      const h0 = TERR.h[i];
      let higher = 0, sum = 0;
      for (let k = 0; k < 8; k++) {
        const dx = [1, -1, 0, 0, 1, 1, -1, -1][k], dz = [0, 0, 1, -1, 1, -1, 1, -1][k];
        const hn = TERR.h[i + dz * TERR.nx + dx];
        sum += hn - h0;
        if (hn > h0 + 0.012) higher++;
      }
      if (higher >= 6) TERR.pond[i] = Math.min(255, Math.round((sum / 8) * 900));
    }
  }

  TERR.built = true;
  TERR.dirty.fill(1); TERR.dirtyAny = true;
  return { path, total, featSpans, def, scale: sc };
}


/* ================================================================== BIKE
   A motocross bike is not a car with two wheels. What makes it behave like
   a bike:

   · the chassis is a rigid body, and lean is NOT an input — it is what
     happens when the front tyre pushes the contact patch out from under
     the centre of mass. The rider countersteers; the bike falls into the
     corner. That fall is simulated, not scripted.
   · both ends have their own unsprung mass on their own strut axis, so a
     landing loads the tyre, then the spring, then the chassis, in that
     order and with the right delay.
   · the rider is a separate mass on a spring. Where it sits changes what
     the bike does, and moving it costs force the arms have to find.
   · every torque the drivetrain makes has a reaction on the frame. That
     is where the wheelie comes from, and why a blip in mid-air lifts the
     front.
   ======================================================================= */

function wheelState() {
  return {
    contact: false, pen: 0, penRate: 0,
    n: [0, 1, 0], cp: [0, 0, 0], axle: [0, 0, 0],
    fw: [0, 0, -1], lat: [1, 0, 0], spinAxis: [1, 0, 0],
    N: 0, Fx: 0, Fy: 0, spin: 0,
    sk: 0, sa: 0, slipSpeed: 0, camber: 0,
    surf: null, grip: 1, roll: 0.03, wet: 0,
    lockT: 0, spinT: 0, airT: 0,
  };
}

function makeInput() {
  return { throttle: 0, brakeF: 0, brakeR: 0, clutch: 0, steer: 0,
           leanZ: 0, leanX: 0, leanY: 0, shiftUp: false, shiftDn: false };
}

function makeBike(key, opts) {
  const cfg = BIKE_BY_KEY[key] || BIKES[0];
  const b = {
    cfg, id: (opts && opts.id) || 0, ai: !!(opts && opts.ai),
    p: [0, 2, 0], v: [0, 0, 0], q: Q.ident(), w: [0, 0, 0],
    accel: [0, 0, 0], accelBody: [0, 0, 0],
    susp: { f: { x: 0, xd: 0, bottom: 0, top: 0 }, r: { x: 0, xd: 0, bottom: 0, top: 0 } },
    wf: wheelState(), wr: wheelState(),
    steer: { a: 0, ad: 0, riderT: 0, i: 0 },
    eng: { w: 0, rpm: 0, gear: 1, clutch: 1, shiftT: 0, shiftTo: -1,
           stalled: false, cutT: 0, thr: 0, torque: 0, load: 0, slip: 0 },
    rider: { p: [0, 0, 0], tgt: [0, 0, 0], wp: [0, 0, 0], wv: [0, 0, 0],
             force: 0, forceF: 0, off: false, offT: 0, worldP: [0, 0, 0] },
    lean: 0, leanRate: 0, leanCmd: 0, gripAvg: 0.9, slideSense: 0, pitch: 0, gref: [0, 1, 0],
    airborne: false, airT: 0, groundT: 0, lastAirTime: 0,
    crashed: false, crashT: 0, crashReason: '',
    hitEnergy: 0, peakG: 0,
    dmg: { wheelF: 0, wheelR: 0, forkBend: 0, suspF: 0, suspR: 0,
           engine: 0, brakeF: 0, brakeR: 0, plastics: 0, total: 0 },
    mud: 0,
    loc: { i: -1, s: 0, lat: 0 },
    inp: makeInput(),
    t: 0,
  };
  return b;
}

/* combined body-frame inertia of bike plus the rider's own spin */
function bikeInertia(b) {
  const I = b.cfg.inertia, R = RIDER.inertia;
  return [I[0] + R[0], I[1] + R[1], I[2] + R[2]];
}

function resetBike(b, x, z, headingRad, opts) {
  const cfg = b.cfg;
  const h = TERR.built ? TERR.height(x, z) : 0;
  b.p = [x, h + cfg.cogH, z];
  b.v = [0, 0, 0];
  b.q = Q.fromEuler(headingRad, 0, 0);
  b.w = [0, 0, 0];
  b.accel = [0, 0, 0]; b.accelBody = [0, 0, 0];
  // start at rider sag so the bike does not pogo on the first frame
  const dsg = designSag(cfg);
  const sagF = dsg.f, sagR = dsg.r;
  b.susp.f = { x: sagF, xd: 0, bottom: 0, top: 0 };
  b.susp.r = { x: sagR, xd: 0, bottom: 0, top: 0 };
  b.wf = wheelState(); b.wr = wheelState();
  b.steer = { a: 0, ad: 0, riderT: 0, i: 0 };
  b.eng = { w: cfg.idleRpm * RPM2RAD, rpm: cfg.idleRpm, gear: (opts && opts.gear) || 1,
            clutch: 1, shiftT: 0, shiftTo: -1, stalled: false, cutT: 0,
            thr: 0, torque: 0, load: 0, slip: 0 };
  b.rider = { p: [0, 0, 0], tgt: [0, 0, 0], wp: [0, 0, 0], wv: [0, 0, 0],
              force: 0, forceF: 0, off: false, offT: 0, worldP: [0, 0, 0] };
  b.lean = 0; b.leanRate = 0; b.leanCmd = 0; b.gripAvg = 0.9; b.slideSense = 0;
  b.pitch = 0; b.gref = [0, 1, 0];
  b.airborne = false; b.airT = 0; b.groundT = 0; b.lastAirTime = 0;
  b.crashed = false; b.crashT = 0; b.crashReason = '';
  b.hitEnergy = 0; b.peakG = 0;
  b.dmg = { wheelF: 0, wheelR: 0, forkBend: 0, suspF: 0, suspR: 0,
            engine: 0, brakeF: 0, brakeR: 0, plastics: 0, total: 0 };
  b.mud = 0;
  b.loc = { i: -1, s: 0, lat: 0 };
  b.inp = makeInput();
  b.t = 0;
  // rolling start: set body speed, wheel speeds and engine speed so they
  // already agree, otherwise the first step is one huge clutch slip
  if (opts && opts.speed) {
    const fwd = [-Math.sin(headingRad), 0, -Math.cos(headingRad)];
    b.v = V.mul(fwd, opts.speed);
    b.wf.spin = opts.speed / cfg.radF;
    b.wr.spin = opts.speed / cfg.radR;
    let gi = b.eng.gear;
    if (opts.gear === undefined) {
      gi = 0;
      for (let k = 0; k < cfg.gears.length; k++) {
        const rpm = b.wr.spin * cfg.gears[k] * RAD2RPM;
        if (rpm < cfg.limitRpm * 0.92) { gi = k; break; }
        gi = k;
      }
    }
    b.eng.gear = gi;
    b.eng.w = Math.max(cfg.idleRpm * RPM2RAD, b.wr.spin * cfg.gears[gi]);
    b.eng.rpm = b.eng.w * RAD2RPM;
  }
  // the rider starts where the bike is holding them
  // (set again after the ride height below)
  // let the wheels find the ground: place the chassis so both tyres touch
  if (TERR.built) {
    // cfg.axleF/axleR are given AT design sag, so with the struts set to
    // that sag the bike is at rest exactly cogH above the ground.
    const hf = TERR.height(x + Math.sin(headingRad) * 0.75, z - Math.cos(headingRad) * 0.75);
    const hr = TERR.height(x - Math.sin(headingRad) * 0.72, z + Math.cos(headingRad) * 0.72);
    b.p[1] = Math.max(hf, hr) + cfg.cogH + 0.005;
  }
  b.rider.wp = V.add(b.p, Q.rot(b.q, RIDER.neutral));
  b.rider.wv = V.copy(b.v);
  return b;
}

/* ------------------------------------------------------------- torque ---- */
function engineTorque(cfg, rpm) {
  const c = cfg.torque;
  if (rpm <= c[0][0]) return c[0][1] * (rpm / c[0][0]);
  for (let i = 1; i < c.length; i++) {
    if (rpm <= c[i][0]) {
      const a = c[i - 1], d = c[i];
      return a[1] + (d[1] - a[1]) * (rpm - a[0]) / (d[0] - a[0]);
    }
  }
  return 0;
}

/* Pacejka-shaped curve, one for slip ratio and one for slip angle. Peak
   near 12 % slip and near 12 degrees of slip angle: knobbies in dirt hold
   on far past what a road tyre would. */
function mfLong(k) {
  const B = 11.0, C = 1.62, E = 0.95;
  const bx = B * k;
  return Math.sin(C * Math.atan(bx - E * (bx - Math.atan(bx))));
}
function mfLat(a) {
  const B = 12.0, C = 1.42, E = 0.95;
  const bx = B * a;
  return Math.sin(C * Math.atan(bx - E * (bx - Math.atan(bx))));
}
/* Grip falls off as the tyre is pressed harder — the reason a light bike
   corners better than its power says it should. */
function loadSens(N, Nref) {
  if (N <= 1) return 1;
  return Math.pow(Nref / Math.max(N, Nref * 0.15), 0.11);
}


/* strut axes in body coordinates. Compression moves the front axle up and
   back along the fork tubes, and the rear axle up and slightly forward on
   the swingarm arc. */
function strutAxes(cfg) {
  const rk = cfg.rake, sw = 12 * DEG;
  return {
    uF: [0, Math.cos(rk), Math.sin(rk)],     // +Z is backwards
    uR: [0, Math.cos(sw), -Math.sin(sw)],
  };
}
function designSag(cfg) {
  return { f: cfg.susp.travelF * 0.22, r: cfg.susp.travelR * 0.33 };
}
function rodrigues(v, k, ang) {
  const c = Math.cos(ang), s = Math.sin(ang);
  const kv = V.cross(k, v), kd = V.dot(k, v) * (1 - c);
  return [v[0] * c + kv[0] * s + k[0] * kd,
          v[1] * c + kv[1] * s + k[1] * kd,
          v[2] * c + kv[2] * s + k[2] * kd];
}
const perp = (vec, u) => V.sub(vec, V.mul(u, V.dot(vec, u)));

/* The steering axis, placed so the contact patch trails the point where
   that axis meets the ground by exactly cfg.trail. Picking a plausible
   looking point on the head tube instead gave 232 mm of trail on a bike
   specified with 118 mm, and the self-aligning torque was twice what a
   rider could hold. */
function steerPivotBody(cfg) {
  const contactFwd = -cfg.axleF[2];
  const axleY = cfg.axleF[1];
  const hAxle = axleY + cfg.cogH;
  const fwd = contactFwd + cfg.trail - hAxle * Math.tan(cfg.rake);
  return BP(0, axleY, fwd);
}

/* tyre cross-section radius: a knobby is a torus, not a disc, and at lean
   the contact rolls onto the shoulder */
function tyreCross(cfg, front) {
  return front ? cfg.tireWidthF * 0.50 : cfg.tireWidthR * 0.50;
}


/* Suspension force along the strut. Positive resists compression: spring,
   progressive rate, digressive damping, a bump stop that hurts, and a
   top-out stop so the wheel cannot fall off the bottom of the stroke. */
function suspForce(S, x, xd, travel, k, prog, cComp, cReb, dmg) {
  let f = 0;
  if (x > 0) {
    const r = x / travel;
    f += k * x * (1 + prog * r * r);
  } else {
    f += 42000 * x - 900 * Math.min(0, xd);      // top-out stop
  }
  const c = (xd > 0 ? cComp : cReb) * (1 - 0.65 * dmg);
  const av = Math.abs(xd);
  let fd;
  if (av <= S.blowoff) fd = c * xd;
  else fd = sign(xd) * c * (S.blowoff + (av - S.blowoff) * S.blowoffScale);
  f += fd;
  // bottoming: the last 25 mm is a rubber stack, and it is meant to hurt
  const over = x - (travel - 0.025);
  let bottom = 0;
  if (over > 0) {
    bottom = S.bumpK * over * over / 0.025 + (xd > 0 ? S.bumpC * xd * (over / 0.025) : 0);
    f += bottom;
  }
  return { f, bottom };
}

/* ------------------------------------------------------------ one step --- */
function physStep(b, dt) {
  const cfg = b.cfg, S = cfg.susp, inp = b.inp;
  const g = WORLD.g;
  const mSprung = cfg.massBike - cfg.massUnsprungF - cfg.massUnsprungR;
  const RM = cfg.riderMass || RIDER.mass;
  const rScale = RM / RIDER.mass;
  const Nref = (cfg.massBike + RM) * g * 0.5;
  const ax = strutAxes(cfg), sag = designSag(cfg);

  // ---- body axes in world
  const axR = Q.rot(b.q, [1, 0, 0]);
  const axU = Q.rot(b.q, [0, 1, 0]);
  const axB = Q.rot(b.q, [0, 0, 1]);
  const axF = V.mul(axB, -1);
  const uFw = Q.rot(b.q, ax.uF), uRw = Q.rot(b.q, ax.uR);

  let F = [0, 0, 0], Tq = [0, 0, 0];
  const addF = (f, atWorld) => {
    V.addTo(F, f);
    V.addTo(Tq, V.cross(V.sub(atWorld, b.p), f));
  };
  const addT = (t) => V.addTo(Tq, t);

  // ---- lean angle, measured against whatever the wheels are standing on
  {
    const nA = b.wf.contact || b.wr.contact
      ? V.norm(V.add(b.wf.contact ? b.wf.n : [0, 0, 0], b.wr.contact ? b.wr.n : [0, 0, 0]))
      : [0, 1, 0];
    b.gref = nA;
    const fH = V.norm(perp(axF, nA));
    const rH = V.cross(fH, nA);
    const nl = Math.atan2(V.dot(axU, rH), V.dot(axU, nA));
    b.leanRate = (nl - b.lean) / dt;
    b.lean = nl;
  }
  const speed = V.len(b.v);
  const fwdSpeed = V.dot(b.v, axF);

  /* ------------------------------------------------------------ rider ---
     The rider is a real mass in world space, held to the bike by a spring
     with different stiffness in each direction: legs are stiff, arms are
     not. Nothing here depends on the bike's acceleration, which matters:
     an earlier version fed the bike's own acceleration back into the
     rider force and out again through the reaction, a loop with a gain of
     78/80 that produced NaN inside a second.

     Everything the arms and legs hold shows up in rider.force, and past a
     limit they let go. */
  {
    const R = RIDER, rr = b.rider;
    let tz = inp.leanZ >= 0 ? inp.leanZ * R.rangeFwd : inp.leanZ * R.rangeBack;
    let ty = inp.leanY >= 0 ? inp.leanY * R.rangeUp : inp.leanY * R.rangeDown;
    if (b.crashed || rr.off) { tz = 0; ty = 0; }
    rr.tgt[0] = (b.crashed || rr.off) ? 0 : clamp(inp.leanX, -1, 1) * R.rangeSide;
    rr.tgt[1] = ty;
    rr.tgt[2] = -tz;                                   // +Z is backwards

    const attachB = V.add(R.neutral, rr.tgt);
    const attachW = V.add(b.p, Q.rot(b.q, attachB));
    const attachV = V.add(b.v, V.cross(b.w, V.sub(attachW, b.p)));

    const errW = V.sub(attachW, rr.wp);
    const dvW = V.sub(attachV, rr.wv);
    const errB = Q.inv(b.q, errW), dvB = Q.inv(b.q, dvW);

    const hold = rr.off ? 0.03 : 1;
    // side, up, fore-aft. Legs are far stiffer than arms.
    /* Legs are the first suspension a motocross bike has, and they are
       softer than the shock. Modelling them as a 26 kN/m strut made the
       rider take the full eight g of a flat landing and let go. */
    const kB = [8200 * rScale * hold, 13500 * rScale * hold, 9400 * rScale * hold];
    const cB = [1100 * rScale * hold, 1750 * rScale * hold, 1200 * rScale * hold];
    const fB = [kB[0] * errB[0] + cB[0] * dvB[0],
                kB[1] * errB[1] + cB[1] * dvB[1],
                kB[2] * errB[2] + cB[2] * dvB[2]];
    // past a point the body simply cannot stretch any further
    const stretch = V.len(errB);
    if (stretch > 0.34) {
      const extra = (stretch - 0.34) * 42000 * hold;
      const dir = V.mul(errB, 1 / stretch);
      fB[0] += dir[0] * extra; fB[1] += dir[1] * extra; fB[2] += dir[2] * extra;
    }
    const fW = Q.rot(b.q, fB);
    rr.force = V.len(fB);

    rr.wv = V.add(rr.wv, V.mul(V.add(V.mul(fW, 1 / RM), [0, -g, 0]), dt));
    rr.wp = V.add(rr.wp, V.mul(rr.wv, dt));
    rr.p = Q.inv(b.q, V.sub(rr.wp, b.p));              // for the renderer
    rr.worldP = rr.wp;
    addF(V.mul(fW, -1), rr.wp);

    /* A sharp spike does not throw a rider off — grip fails when the load
       stays up. Filtered over about a twentieth of a second, which is
       roughly how long an arm can hold anything. */
    rr.forceF = lerp(rr.forceF || 0, rr.force, Math.min(1, dt / 0.055));
    if (!rr.off && rr.forceF > R.gripLimit * rScale) {
      rr.off = true; rr.offT = 0;
      if (!b.crashed) { b.crashed = true; b.crashT = 0; b.crashReason = 'Thrown off'; }
    }
  }

  /* ---------------------------------------------------------- steering ---
     Lean is not an input. The rider aims for a lean angle, a balance loop
     asks for a steer angle, and the bars are turned with a torque an arm
     could actually produce. Countersteer falls out of that by itself: ask
     for right lean and the error goes negative, which steers left first.

     The loop gains are scheduled on speed. They have to be: the steer
     angle that corrects a given lean falls with the square of speed, so a
     fixed gain that behaves at walking pace commands 27 degrees of lock at
     55 km/h, and the bike thrashes itself into the ground in two seconds.
     Kp and Kd below come from the roll equation of an inverted pendulum on
     a steered wheel, solved for a chosen natural frequency and damping. */
  {
    const st = b.steer;
    const cont = (b.wf.contact ? 1 : 0) * 0.75 + (b.wr.contact ? 1 : 0) * 0.25;
    const vBlend = smoothstep((speed - 2.2) / 3.4);
    /* A rider cannot ask for more lean than the ground will hold: on flat
       ground the limit is atan(mu). Lean is measured against the surface
       the tyres are on, so a berm still allows far more than this. */
    const gripNow = (b.wf.contact ? b.wf.grip : 0) + (b.wr.contact ? b.wr.grip : 0);
    const nCon = (b.wf.contact ? 1 : 0) + (b.wr.contact ? 1 : 0);
    if (nCon > 0) b.gripAvg = lerp(b.gripAvg || 0.9, gripNow / nCon, Math.min(1, dt * 6));
    /* How much lean the ground will hold RIGHT NOW. Grip already spent on
       driving or braking is not available for cornering — that is the
       friction ellipse, and it is what a rider feels through the tyre. */
    const Ntot = b.wf.N + b.wr.N;
    const uLong = Ntot > 50 ? Math.abs(b.wf.Fx + b.wr.Fx) / Ntot : 0;
    const muNow = (b.gripAvg || 0.9) * 0.90;
    const latAvail = Math.sqrt(Math.max(0.04, muNow * muNow - uLong * uLong));
    const leanCap = Math.atan(latAvail * 0.80);
    /* A rider feels the front push and stands the bike up before it goes.
       Without this the loop happily asks for the last five per cent of
       grip and lays the bike down on mud and gravel while the rider is
       doing nothing but holding the bars. The player can still crash: the
       lean they ask for is still theirs, and grip lost to braking or
       throttle is not given back here. */
    const slideF = clamp((Math.abs(b.wf.sa) - 0.12) / 0.13, 0, 1);
    const slideR = clamp((Math.abs(b.wr.sa) - 0.20) / 0.20, 0, 1);
    b.slideSense = lerp(b.slideSense || 0, Math.max(slideF, slideR * 0.55), Math.min(1, dt * 9));
    const maxLean = Math.min(0.92 + 0.22 * smoothstep((speed - 8) / 14), leanCap)
                  * (1 - 0.42 * b.slideSense);
    const sIn = clamp(inp.steer, -1, 1);
    let dCmd;
    if (b.crashed || b.rider.off) {
      dCmd = 0;
    } else {
      /* A rider rolls into a corner. Snapping the target across in one
         step makes the loop fire a huge countersteer and the bike arrives
         at the lean angle with far too much roll rate to stop. */
      const want = sIn * maxLean;
      const rollRate = 2.6 - 1.1 * smoothstep((speed - 6) / 16);
      const dmax = rollRate * dt;
      b.leanCmd = b.leanCmd === undefined ? 0 : b.leanCmd;
      b.leanCmd += clamp(want - b.leanCmd, -dmax, dmax);
      const leanTgt = b.leanCmd;
      const hCg = cfg.cogH, L = cfg.wheelbase;
      /* Overdamped on purpose. The design assumes the steer angle follows
         instantly and the tyre answers instantly; neither is true, and the
         phase those two lose showed up as an eight-degree overshoot. On
         flat hard pack eight degrees past the target is past atan(mu), so
         the tyres let go and the bike highsides — from nothing but a
         steady corner. */
      const wn = 3.6, zeta = 1.55;
      const vv = Math.max(Math.abs(fwdSpeed), 3.2);
      const Kp = L * (g + wn * wn * hCg) / (vv * vv);
      const Kd = 2 * zeta * wn * hCg * L / (vv * vv);
      // desired steer to the RIGHT, then converted to the steer-axis angle
      /* Feedforward from the lean the bike is ACTUALLY at: the steer angle
         that holds this lean, right now. Then the proportional term is
         free to do nothing but close the gap to the target.

         Taking the feedforward from the TARGET instead looks equally
         reasonable and is not: the loop then settles wherever the
         feedforward and the proportional term happen to cancel, which for
         these gains was 24 degrees no matter what was asked for. With it
         taken from the current lean the equilibrium is the target, by
         construction. And it is still stabilising — more steer means a
         tighter turn, which stands the bike up. */
      const ff = L * g * Math.tan(clamp(b.lean, -1.3, 1.3)) / (vv * vv);
      // and if it does get past what the ground will hold, stand it up hard
      const over = Math.max(0, Math.abs(b.lean) - leanCap) * sign(b.lean);
      const dRight = ff + Kp * (b.lean - leanTgt) + Kd * b.leanRate + 0.55 * over;
      const balance = -clamp(dRight, -0.55, 0.55) / Math.cos(cfg.rake);
      const direct = -sIn * 0.42;
      dCmd = lerp(direct, balance, vBlend * cont) + (1 - cont) * (-sIn * 0.34);
    }
    dCmd = clamp(dCmd, -0.62, 0.62);
    /* Arms are stiff. At 220 Nm/rad the tyre's own moment held the bars
       at a third of the angle the rider was asking for, and the bike took
       four seconds to reach a lean it should reach in one. The integral
       term takes out what is left, the way a rider adjusts until the bike
       is doing what they wanted. The clamp is the real limit: how hard a
       human can push a handlebar. */
    const dErr = dCmd - st.a;
    st.i = clamp((st.i || 0) + dErr * dt, -0.09, 0.09);
    let Trider = 600 * dErr + 900 * st.i - 40 * st.ad;
    if (Math.abs(Trider) > 95) st.i -= dErr * dt;          // anti-windup
    Trider = clamp(Trider, -95, 95) * (b.rider.off ? 0.05 : 1);
    st.riderT = Trider;

    // self-aligning torque and gyroscopic precession, both about the fork axis
    const pivot = V.add(b.p, Q.rot(b.q, steerPivotBody(cfg)));
    let Ttire = 0, Tgyro = 0;
    if (b.wf.contact) {
      const Ft = V.add(V.mul(b.wf.n, b.wf.N), V.add(V.mul(b.wf.fw, b.wf.Fx), V.mul(b.wf.lat, b.wf.Fy)));
      Ttire = V.dot(V.cross(V.sub(b.wf.cp, pivot), Ft), uFw);
    }
    {
      const Hf = V.mul(b.wf.spinAxis, -b.wf.spin * cfg.wheelIF);
      Tgyro = -V.dot(V.cross(b.w, Hf), uFw);
    }
    const Is = 0.62 + cfg.wheelIF * 0.35;
    const damp = 6.0 + 26 * b.dmg.forkBend;
    st.dbg = { Trider, Ttire, Tgyro, dCmd };
    const add = (Trider + Ttire + Tgyro - damp * st.ad) / Is;
    st.ad += add * dt;
    st.a += st.ad * dt;
    const lock = 0.60;
    if (st.a > lock) { st.a = lock; st.ad = Math.min(0, st.ad); }
    if (st.a < -lock) { st.a = -lock; st.ad = Math.max(0, st.ad); }
    // turning the bars pushes back on the frame — this is what a whip is
    addT(V.mul(uFw, -Trider));

    /* Below a walking pace steering cannot hold the bike up, and a real
       rider balances with legs and a dab instead. That is a roll torque,
       and it fades out as soon as the bike is moving. */
    const slow = 1 - smoothstep((speed - 1.4) / 3.0);
    if (slow > 0.001 && !b.crashed && !b.rider.off && (b.wf.contact || b.wr.contact)) {
      const Troll = clamp(-560 * b.lean - 170 * b.leanRate, -420, 420) * slow;
      addT(V.mul(axF, Troll));
    }
  }
  const spinAxF = V.norm(rodrigues(axR, uFw, b.steer.a));

  /* ------------------------------------------------------------ wheels --- */
  const wheels = [
    { w: b.wf, u: uFw, uB: ax.uF, axleRest: V.sub(cfg.axleF, V.mul(ax.uF, sag.f)),
      R: cfg.radF * (1 - 0.06 * b.dmg.wheelF), I: cfg.wheelIF, mu_: cfg.massUnsprungF,
      travel: S.travelF, k: S.kF, prog: S.kProgF, cC: S.cCompF, cR: S.cRebF,
      tireK: S.tireKF, spinAxis: spinAxF, front: true, sus: b.susp.f,
      brake: cfg.brakeF * (1 - 0.8 * b.dmg.brakeF), dmg: b.dmg.suspF, width: cfg.tireWidthF,
      rc: tyreCross(cfg, true) },
    { w: b.wr, u: uRw, uB: ax.uR, axleRest: V.sub(cfg.axleR, V.mul(ax.uR, sag.r)),
      R: cfg.radR * (1 - 0.06 * b.dmg.wheelR), I: cfg.wheelIR, mu_: cfg.massUnsprungR,
      travel: S.travelR, k: S.kR, prog: S.kProgR, cC: S.cCompR, cR: S.cRebR,
      tireK: S.tireKR, spinAxis: axR, front: false, sus: b.susp.r,
      brake: cfg.brakeR * (1 - 0.8 * b.dmg.brakeR), dmg: b.dmg.suspR, width: cfg.tireWidthR,
      rc: tyreCross(cfg, false) },
  ];

  for (const W of wheels) {
    const w = W.w, sus = W.sus;
    const axleBody = V.add(W.axleRest, V.mul(W.uB, sus.x));
    const axle = V.add(b.p, Q.rot(b.q, axleBody));
    w.axle = axle;
    // velocity of the axle: chassis motion plus the strut sliding
    const vAxle = V.add(V.add(b.v, V.cross(b.w, V.sub(axle, b.p))), V.mul(W.u, sus.xd));

    /* ---- ground contact.
       The tyre is a torus, so at lean the contact rolls onto the shoulder
       and sits to the SIDE of the axle, not underneath it. Treating it as
       a thin disc directly below the axle throws away the whole roll
       moment, and the bike then leans further and further into a corner
       until it lies down — which is exactly what it did.
       Five points are taken around the tread circle rather than one, so
       the wheel climbs an edge instead of dropping into every hole
       narrower than itself. */
    const RR = W.R, rc = W.rc, Rc = RR - rc;
    const nEst = w.n;
    let mUp = perp(nEst, W.spinAxis);
    if (V.len2(mUp) < 1e-8) mUp = perp([0, 1, 0], W.spinAxis);
    mUp = V.norm(mUp);
    let need = -1e9, nSum = [0, 0, 0];
    const samples = [];
    for (let sIdx = -2; sIdx <= 2; sIdx++) {
      const th = sIdx * 0.20;
      const dir = rodrigues(mUp, W.spinAxis, th);
      const off = V.add(V.mul(dir, Rc), V.mul(nEst, rc));   // contact -> axle
      const sx = axle[0] - off[0], sz = axle[2] - off[2];
      const hg = TERR.built ? TERR.height(sx, sz) : 0;
      const req = hg + off[1];
      samples.push({ req, sx, sz, hg, off });
      if (req > need) { need = req; }
    }
    let wsum = 0, cpBest = null;
    for (const sp of samples) {
      const ww = Math.max(0, 1 - (need - sp.req) / 0.075);
      if (ww > 0) {
        const nn = TERR.built ? TERR.normal(sp.sx, sp.sz) : [0, 1, 0];
        V.mad(nSum, nn, ww); wsum += ww;
        if (!cpBest || sp.req > cpBest.req) cpBest = sp;
      }
    }
    const n = wsum > 0 ? V.norm(nSum) : [0, 1, 0];
    const pen = need - axle[1];
    w.pen = Math.max(0, pen);
    w.contact = pen > 0;
    w.n = n;
    w.cpFlat = cpBest ? [cpBest.sx, cpBest.hg, cpBest.sz] : null;

    let N = 0, Fx = 0, Fy = 0;
    if (w.contact) {
      const penRate = -V.dot(vAxle, n);
      w.penRate = penRate;
      /* Tyre and ground are two springs in series. On sand or mud the
         ground is by far the softer of the two and it damps as well —
         modelling only the tyre leaves a 14 Hz wheel hop that soft ground
         does not have. */
      const giPre = TERR.built ? TERR.info(axle[0], axle[2]) : null;
      const hard = giPre ? giPre.hardness : 1;
      const tireK = W.tireK * (1 - 0.25 * (W.front ? b.dmg.wheelF : b.dmg.wheelR))
                  * lerp(0.40, 1.0, hard);
      const cGround = S.tireC * lerp(3.4, 1.0, hard);
      const dampF = clamp(cGround * penRate, -0.6 * tireK * w.pen - 300, 0.9 * tireK * w.pen + 3000);
      N = Math.max(0, tireK * w.pen + dampF);
      const cp = w.cpFlat ? w.cpFlat : V.sub(axle, V.mul(n, RR - w.pen));
      w.cp = cp;

      const fw = V.norm(V.cross(n, W.spinAxis));
      const lat = V.cross(fw, n);
      w.fw = fw; w.lat = lat;
      const spinVec = V.mul(W.spinAxis, -w.spin);
      const rC = V.sub(cp, axle);
      const vCp = V.add(V.add(vAxle, V.cross(b.w, rC)), V.cross(spinVec, rC));
      const vLong = V.dot(vCp, fw), vLat = V.dot(vCp, lat);
      const vRoll = V.dot(vAxle, fw);
      const vRef = Math.max(Math.abs(vRoll), 1.4);

      const kInst = clamp(-vLong / vRef, -4, 4);
      const aInst = Math.atan2(vLat, Math.max(Math.abs(vRoll), 0.7));
      const rateK = Math.max(Math.abs(vRoll), 1.2) / 0.26;
      const rateA = Math.max(Math.abs(vRoll), 1.2) / 0.34;
      w.sk += (kInst - w.sk) * Math.min(1, rateK * dt);
      w.sa += (aInst - w.sa) * Math.min(1, rateA * dt);

      const gi = TERR.built ? TERR.info(cp[0], cp[2]) : { grip: 1, roll: 0.03, surf: SURFACES[0], wet: 0 };
      w.surf = gi.surf; w.grip = gi.grip; w.roll = gi.roll; w.wet = gi.wet;
      const camber = -Math.asin(clamp(V.dot(W.spinAxis, n), -1, 1));
      w.camber = camber;
      const mu = gi.grip * cfg.gripScale * loadSens(N, Nref) * (1 - 0.30 * b.mud);
      const latSlip = w.sa - 0.11 * camber;

      let fx = mu * mfLong(w.sk), fy = -mu * mfLat(latSlip);
      const mag = Math.hypot(fx, fy);
      if (mag > mu) { const s2 = mu / mag; fx *= s2; fy *= s2; }
      Fx = N * fx; Fy = N * fy;
      // rolling resistance, and the extra a wheel pays for ploughing
      const sink = clamp(w.pen / 0.05, 0, 1) * (1 - gi.surf.hardness);
      Fx -= N * (gi.roll + 0.05 * sink) * Math.tanh(vRoll / 0.45);
      w.slipSpeed = Math.hypot(vLong, vLat);
      w.N = N; w.Fx = Fx; w.Fy = Fy;

      const Ftot = V.add(V.mul(n, N), V.add(V.mul(fw, Fx), V.mul(lat, Fy)));
      const Fu = V.dot(Ftot, W.u);
      const perpF = perp(Ftot, W.u);
      addF(perpF, cp);
      /* A wheel is free to turn on its axle, so no moment ABOUT THE SPIN
         AXIS can reach the frame through the bearing — only through the
         brake or the chain. Applying the contact force at the contact
         patch hands the frame that moment anyway, and the brake reaction
         is then added on top of it: the same torque, counted twice.
         The bike did a stoppie the instant the front brake was touched,
         and wheelied permanently under power. Take it back out. */
      const rSpin = V.sub(cp, axle);
      w.Tground = -V.dot(V.cross(rSpin, Ftot), W.spinAxis);
      addT(V.mul(W.spinAxis, -V.dot(V.cross(rSpin, perpF), W.spinAxis)));

      // --- unsprung mass rides the strut
      const rMount = V.sub(axle, b.p);
      const aMount = V.add(b.accel, V.cross(b.w, V.cross(b.w, rMount)));
      const sf = suspForce(S, sus.x, sus.xd, W.travel, W.k, W.prog, W.cC, W.cR, W.dmg);
      sus.bottom = sf.bottom;
      /* Anti-squat. The chain pulls the swingarm against its pivot, so a
         motocross bike RISES at the back on the gas instead of squatting.
         It is an internal force pair — chassis up, wheel down — so it adds
         nothing to the total, only to the attitude. */
      const antiSq = W.front ? 0 : Fx * 0.80;
      const xdd = (Fu - sf.f - antiSq) / W.mu_ + V.dot([0, -g, 0], W.u) - V.dot(aMount, W.u);
      sus.xd += xdd * dt;
      sus.x += sus.xd * dt;
      addF(V.mul(W.u, sf.f + antiSq), axle);
      /* Across the strut the wheel is bolted to the frame, so what it
         hands over is its weight MINUS its own inertia. Handing over the
         bare weight is right while the bike is standing still and wrong
         the moment it is falling: in free fall both are falling together
         and the wheel presses on nothing. It made the whole machine fall
         3.5 % slower than gravity. */
      addF(perp(V.mul(V.sub([0, -g, 0], b.accel), W.mu_), W.u), axle);
    } else {
      w.N = 0; w.Fx = 0; w.Fy = 0; w.penRate = 0; w.slipSpeed = 0;
      w.sk += (0 - w.sk) * Math.min(1, 6 * dt);
      w.sa += (0 - w.sa) * Math.min(1, 6 * dt);
      w.cp = V.sub(axle, V.mul([0, 1, 0], RR));
      w.fw = V.norm(perp(axF, [0, 1, 0]));
      w.lat = V.cross(w.fw, [0, 1, 0]);
      const rMount = V.sub(axle, b.p);
      const aMount = V.add(b.accel, V.cross(b.w, V.cross(b.w, rMount)));
      const sf = suspForce(S, sus.x, sus.xd, W.travel, W.k, W.prog, W.cC, W.cR, W.dmg);
      sus.bottom = 0;
      const xdd = -sf.f / W.mu_ + V.dot([0, -g, 0], W.u) - V.dot(aMount, W.u);
      sus.xd += xdd * dt;
      sus.x += sus.xd * dt;
      addF(V.mul(W.u, sf.f), axle);
      addF(perp(V.mul(V.sub([0, -g, 0], b.accel), W.mu_), W.u), axle);
    }
    if (sus.x > W.travel + 0.02) { sus.x = W.travel + 0.02; sus.xd = Math.min(0, sus.xd); }
    if (sus.x < -0.012) { sus.x = -0.012; sus.xd = Math.max(0, sus.xd); }
    w.spinAxis = W.spinAxis; w.Reff = W.R;
    W.Ftyre = { Fx, Fy, N };
  }
  b.wf.spinAxis = spinAxF;
  b.wr.spinAxis = axR;


  /* ------------------------------------------------------- drivetrain ---
     Engine, clutch, gearbox and rear wheel are one chain. Every torque in
     it has a reaction on the frame, which is where the wheelie comes from
     and why a blip in the air lifts the front. */
  {
    const e = b.eng;
    const thrTgt = b.crashed || b.rider.off ? 0 : clamp(inp.throttle, 0, 1);
    e.thr += (thrTgt - e.thr) * Math.min(1, dt / 0.028);

    if (e.shiftT > 0) {
      e.shiftT -= dt;
      if (e.shiftT <= 0 && e.shiftTo >= 0) { e.gear = e.shiftTo; e.shiftTo = -1; }
    } else {
      if (inp.shiftUp && e.gear < cfg.gears.length - 1) { e.shiftTo = e.gear + 1; e.shiftT = cfg.shiftTime; }
      else if (inp.shiftDn && e.gear > 0) { e.shiftTo = e.gear - 1; e.shiftT = cfg.shiftTime; }
    }
    inp.shiftUp = false; inp.shiftDn = false;

    const ratio = cfg.gears[e.gear];
    const wWheel = b.wr.spin;
    const wSync = wWheel * ratio;

    /* The clutch is a hand, not a switch. Standing still at idle with the
       throttle shut the rider holds the lever in — otherwise the engine
       drags the bike forward and, worse, its reaction torque quietly
       unloads the front wheel while the bike is supposed to be at rest.
       It comes out as the revs rise under throttle, and once the bike is
       rolling it stays out. */
    const wheelRpm = Math.abs(wSync) * RAD2RPM;
    const rolling = smoothstep((wheelRpm - cfg.idleRpm * 0.50) / (cfg.idleRpm * 0.55));
    const launching = smoothstep((e.rpm - cfg.stallRpm * 1.30) / (cfg.idleRpm * 1.05))
                    * smoothstep(e.thr * 4);
    let engage = Math.min(1 - clamp(inp.clutch, 0, 1), Math.max(rolling, launching));
    if (e.shiftT > 0) engage = 0;
    e.clutch = engage;

    // engine torque, rev limiter, idle governor, stall
    let Te = 0;
    if (!e.stalled) {
      if (e.cutT > 0) e.cutT -= dt;
      else if (e.rpm > cfg.limitRpm) e.cutT = 0.045;
      const idleHelp = clamp((cfg.idleRpm - e.rpm) / 300, 0, 1) * 0.40;
      const th = Math.max(e.thr, idleHelp);
      Te = e.cutT > 0 ? 0 : engineTorque(cfg, e.rpm) * th * (1 - 0.55 * b.dmg.engine);
      Te -= cfg.engBrake * e.w * (1 - 0.85 * e.thr);
      Te -= 12 * cfg.engineI;                 // internal friction, scales with the engine
    }
    e.torque = Te;

    /* Solving the clutch explicitly does not work at any timestep this
       simulation can afford. In first gear the wheel, seen through the
       gearbox, has about one sixtieth of the crank's inertia, so a torque
       that is right at the start of a step is wildly wrong by the end of
       it: the torque flipped sign every single step and reached 4900 Nm
       at the rear wheel. Instead: solve for the torque that would make
       engine and wheel turn at the same speed after this step, then clamp
       it to what the plates can actually hold. Below the clamp the clutch
       is locked, above it, it slips. Stable at any step size. */
    const cap = cfg.clutchTorque * engage;
    const eff = 0.965;                       // chain and gearbox losses
    const Iw = cfg.wheelIR, Ie = cfg.engineI;
    const TextWheel = -b.wr.Fx * (b.wr.Reff || cfg.radR) - (b.wr.TbLast || 0);
    let Tclutch = 0;
    if (cap > 1e-6 && ratio > 0) {
      const num = (e.w - ratio * wWheel) / dt + Te / Ie - ratio * TextWheel / Iw;
      const den = 1 / Ie + ratio * ratio * eff / Iw;
      Tclutch = clamp(num / den, -cap, cap);
    }
    e.slip = e.w - ratio * wWheel;
    e.locked = Math.abs(Tclutch) < cap - 1e-6;

    e.w += ((Te - Tclutch) / Ie) * dt;
    if (e.w < 0) e.w = 0;
    e.rpm = e.w * RAD2RPM;
    if (!e.stalled && e.rpm < cfg.stallRpm && engage > 0.25 && Math.abs(wSync) < 4) {
      e.stalled = true; e.w = 0; e.rpm = 0;
    }
    if (e.rpm > cfg.cutRpm) b.dmg.engine = Math.min(1, b.dmg.engine + dt * 0.02);

    b.driveTorque = Tclutch * ratio * eff;
  }

  /* ---- wheel spin: drive, brake, and the ground pushing back ----------- */
  for (const W of wheels) {
    const w = W.w;
    const Tdrive = W.front ? 0 : (b.driveTorque || 0);
    // the exact ground torque about the spin axis, from the contact solve
    const Tg = w.contact ? (w.Tground || 0) : 0;
    let spinDot = (Tdrive + Tg) / W.I;
    let spinNext = w.spin + spinDot * dt;
    const brakeCmd = W.front ? inp.brakeF : inp.brakeR;
    const Tb = clamp(brakeCmd, 0, 1) * W.brake * (b.rider.off ? 0.25 : 1);
    let TbApplied = 0;
    if (Tb > 0) {
      const stopT = Math.abs(spinNext) * W.I / dt;
      if (stopT <= Tb) { TbApplied = stopT * sign(spinNext); spinNext = 0; w.lockT += dt; }
      else { TbApplied = Tb * sign(spinNext); spinNext -= sign(spinNext) * Tb * dt / W.I; w.lockT = 0; }
    } else w.lockT = 0;
    w.spin = spinNext;
    w.TbLast = TbApplied;
    // reaction of drive and brake torque on the frame
    addT(V.mul(W.spinAxis, Tdrive - TbApplied));
    // gyroscopic reaction of a spinning wheel
    const H = V.mul(W.spinAxis, -w.spin * W.I);
    addT(V.mul(V.cross(b.w, H), -1));
    w.spinT = w.contact ? 0 : w.spinT;
  }

  /* --------------------------------------------------- air and gravity --- */
  {
    const tuck = clamp(inp.leanZ, 0, 1);
    const cda = lerp(cfg.cdaSit, cfg.cdaTuck, tuck);
    const vv = V.len(b.v);
    if (vv > 0.1) {
      const d = V.mul(b.v, -0.5 * WORLD.rhoAir * cda * vv);
      // drag acts around the rider's chest, a little above the combined mass
      addF(d, V.add(b.p, V.mul(axU, 0.17)));
    }
    V.addTo(F, [0, -mSprung * g, 0]);
  }

  /* ------------------------------------ the frame itself hitting dirt --- */
  if (TERR.built) {
    const pts = [
      { p: BP(0, -0.28, -0.05), name: 'skid', hard: 1 },
      { p: BP(0, -0.10, 0.55), name: 'front', hard: 0.8 },
      { p: BP(0, 0.30, -0.55), name: 'tail', hard: 0.6 },
      { p: BP(0.34, 0.34, 0.50), name: 'barR', hard: 0.5 },
      { p: BP(-0.34, 0.34, 0.50), name: 'barL', hard: 0.5 },
      { p: BP(0.30, -0.20, -0.02), name: 'pegR', hard: 0.6 },
      { p: BP(-0.30, -0.20, -0.02), name: 'pegL', hard: 0.6 },
    ];
    for (const q of pts) {
      const wp = V.add(b.p, Q.rot(b.q, q.p));
      const hg = TERR.height(wp[0], wp[2]);
      const d = hg - wp[1];
      if (d > 0) {
        const nn = TERR.normal(wp[0], wp[2]);
        const vp = V.add(b.v, V.cross(b.w, V.sub(wp, b.p)));
        const vn = V.dot(vp, nn);
        const k = 120000 * q.hard, c = 3000 * q.hard;
        const fN = Math.max(0, k * d - c * Math.min(0, vn) * 0 + (vn < 0 ? -c * vn : 0));
        const tang = V.sub(vp, V.mul(nn, vn));
        const ft = V.mul(V.norm(tang), -Math.min(V.len(tang) * 400, fN * 0.85));
        addF(V.add(V.mul(nn, fN), ft), wp);
        b.dmg.plastics = Math.min(1, b.dmg.plastics + Math.abs(vn) * dt * 0.10 * q.hard);
        if (!b.crashed && V.len(b.v) > 3.5 && q.hard >= 0.5) {
          b.crashed = true; b.crashT = 0; b.crashReason = 'Down';
        }
      }
    }
  }

  /* ------------------------------------------------- integrate the body -- */
  {
    const a = V.mul(F, 1 / mSprung);
    b.accel = a;
    b.accelBody = Q.inv(b.q, a);
    V.mad(b.v, a, dt);
    V.mad(b.p, b.v, dt);

    const Ib = bikeInertia(b);
    const wB = Q.inv(b.q, b.w);
    const tB = Q.inv(b.q, Tq);
    const gyro = [
      wB[1] * (Ib[2] * wB[2]) - wB[2] * (Ib[1] * wB[1]),
      wB[2] * (Ib[0] * wB[0]) - wB[0] * (Ib[2] * wB[2]),
      wB[0] * (Ib[1] * wB[1]) - wB[1] * (Ib[0] * wB[0]),
    ];
    const aB = [(tB[0] - gyro[0]) / Ib[0], (tB[1] - gyro[1]) / Ib[1], (tB[2] - gyro[2]) / Ib[2]];
    V.addTo(b.w, V.mul(Q.rot(b.q, aB), dt));
    b.q = Q.integrate(b.q, b.w, dt);
  }

  /* ------------------------------------------------------- bookkeeping --- */
  {
    const onGround = b.wf.contact || b.wr.contact;
    if (onGround) {
      if (b.airborne && b.airT > 0.25) b.lastAirTime = b.airT;
      b.airborne = false; b.airT = 0; b.groundT += dt;
    } else {
      if (!b.airborne) b.groundT = 0;
      b.airborne = true; b.airT += dt;
    }
    // landing loads: how hard, and what it costs
    // positive = nose up. The sign was the other way round, which quietly
    // disabled the wheelie cut in riderThrottle: it was looking for a
    // positive pitch that a wheelie never produced.
    b.pitch = Math.asin(clamp(axF[1], -1, 1));
    const gForce = Math.abs(V.dot(b.accel, axU)) / g;
    if (gForce > b.peakG) b.peakG = gForce;
    for (const W of wheels) {
      // a hit hard enough to bend a rim does not have to bottom the stroke
      const over = W.w.N / Nref - 4.0;
      if (over > 0) {
        const h2 = over * dt * 0.055;
        if (W.front) b.dmg.wheelF = Math.min(1, b.dmg.wheelF + h2);
        else b.dmg.wheelR = Math.min(1, b.dmg.wheelR + h2);
      }
      if (W.sus.bottom > 0) {
        const harm = W.sus.bottom / 60000 * dt;
        if (W.front) { b.dmg.suspF = Math.min(1, b.dmg.suspF + harm * 0.5);
                       b.dmg.wheelF = Math.min(1, b.dmg.wheelF + harm * 0.22); }
        else { b.dmg.suspR = Math.min(1, b.dmg.suspR + harm * 0.5);
               b.dmg.wheelR = Math.min(1, b.dmg.wheelR + harm * 0.22); }
      }
    }
    const d = b.dmg;
    d.total = clamp((d.wheelF + d.wheelR + d.suspF + d.suspR + d.engine
                     + d.brakeF + d.brakeR + d.plastics * 0.4 + d.forkBend) / 6, 0, 1);

    // the ground remembers: only every fourth step, it is expensive
    b.digAcc = (b.digAcc || 0) + dt;
    if (b.digAcc >= dt * 4) {
      const ddt = b.digAcc; b.digAcc = 0;
      for (const W of wheels) {
        const w = W.w;
        if (!w.contact || w.N < 40) continue;
        const slipN = clamp(w.slipSpeed / 6, 0, 1.4);
        /* Cut the rut BEHIND the contact patch. Lowering the ground the
           tyre is standing on, three millimetres at a time, a hundred
           times a second, is a broadband shaker bolted to the wheel: it
           found the 14 Hz wheel-hop mode and the bike bounced itself over
           on sand every single time. A real tyre leaves the rut behind
           it. Far enough back that the bilinear stencil under the wheel
           does not reach it. */
        /* Ruts form over a race, not over a corner. At three times this
           rate a single bike cut its own 160 mm trench on mud within two
           seconds and then tripped over it. */
        const depth = ddt * (0.85 + 2.4 * slipN) * clamp(w.N / Nref, 0, 3) * 0.30;
        const back = 0.62;
        TERR.dig(w.cp[0] - w.fw[0] * back, w.cp[2] - w.fw[2] * back,
                 w.fw[0], w.fw[2], depth,
                 W.width * 0.5 + 0.055, ddt * 0.30 * clamp(w.N / Nref, 0, 2));
      }
    }
    // mud sticks to bike and rider
    if (b.wr.contact && b.wr.surf) {
      const pick = b.wr.wet * (b.wr.surf.spray) * dt * 0.35;
      b.mud = clamp(b.mud + pick - dt * 0.02, 0, 1);
    } else b.mud = clamp(b.mud - dt * 0.02, 0, 1);

    if (b.crashed) {
      b.crashT += dt;
      if (!b.rider.off && b.crashT > 0.12) b.rider.off = true;
    }
    if (TERR.built && TERR.path) {
      const l = TERR.locate(b.p[0], b.p[2], b.loc.i);
      if (l) b.loc = l;
    }
    b.t += dt;
  }
}

/* run the simulation for a wall-clock slice, in fixed steps */
function stepBike(b, seconds) {
  const DT = WORLD.DT;
  const n = Math.round(seconds / DT);
  for (let i = 0; i < n; i++) physStep(b, DT);
  return n;
}


/* A featureless plate of one material. Used by the test suites to measure
   one thing at a time, and by the flat-track practice mode. */
function buildFlat(halfX, surfId, slopeDeg, halfZ) {
  if (halfZ === undefined) halfZ = halfX;
  TERR.path = null; TERR.buckets = null;
  TERR.alloc(-halfX, -halfZ, halfX, halfZ);
  const sl = Math.tan((slopeDeg || 0) * DEG);
  for (let iz = 0; iz < TERR.nz; iz++) {
    for (let ix = 0; ix < TERR.nx; ix++) {
      const i = iz * TERR.nx + ix;
      TERR.h[i] = (TERR.x0 + ix * TERR.CS) * sl;
      TERR.surf[i] = surfId === undefined ? SURF.HARDPACK : surfId;
    }
  }
  TERR.built = true; TERR.wetGlobal = 0;
  TERR.dirty.fill(1); TERR.dirtyAny = true;
  return TERR;
}


/* ------------------------------------------------------- rider skills ---
   What a rider does without thinking about it: change gear at the right
   moment, ease off when the rear lights up, and shut it when the front
   comes up too far. The AI runs on these, the test suites measure through
   them, and the player can switch them on as assists.
   ------------------------------------------------------------------- */
function autoGearbox(b, aggression) {
  const e = b.eng, cfg = b.cfg;
  if (e.shiftT > 0 || e.stalled) return;
  const a = aggression === undefined ? 1 : aggression;
  const upAt = cfg.limitRpm * (0.90 + 0.07 * a);
  if (e.rpm > upAt && e.gear < cfg.gears.length - 1 && e.clutch > 0.55) {
    b.inp.shiftUp = true; return;
  }
  if (e.gear > 0) {
    const rpmDown = Math.abs(b.wr.spin) * cfg.gears[e.gear - 1] * RAD2RPM;
    const lowAt = cfg.limitRpm * 0.34;
    if (e.rpm < lowAt && rpmDown < cfg.limitRpm * 0.90) b.inp.shiftDn = true;
  }
}
/* Traction and wheelie control, the way a wrist does it. level 0 = off. */
function riderThrottle(b, want, level) {
  const L = level === undefined ? 1 : clamp(level, 0, 1);
  if (L <= 0) return clamp(want, 0, 1);
  const spin = clamp((b.wr.sk - 0.16) / 0.28, 0, 1);
  const air = b.wf.contact ? 0 : 1;
  const nose = clamp((b.pitch - 0.16) / 0.20, 0, 1);
  const lift = Math.max(nose, air * 0.55);
  return clamp(want * (1 - 0.88 * spin * L) * (1 - 0.85 * lift * L), 0, 1);
}
/* Brake modulation: hold the tyre near the peak of its slip curve instead
   of locking it. This is what separates a 25 metre stop from a 40 metre
   one, and it is a skill, not a device. */
function riderBrake(b, wantF, wantR, level) {
  const L = level === undefined ? 1 : clamp(level, 0, 1);
  if (L <= 0) return [clamp(wantF, 0, 1), clamp(wantR, 0, 1)];
  const easeF = clamp((-b.wf.sk - 0.14) / 0.16, 0, 1);
  const easeR = clamp((-b.wr.sk - 0.20) / 0.22, 0, 1);
  const lockF = b.wf.lockT > 0.02 ? 1 : 0;
  const lockR = b.wr.lockT > 0.05 ? 1 : 0;
  return [clamp(wantF * (1 - 0.9 * Math.max(easeF, lockF) * L), 0, 1),
          clamp(wantR * (1 - 0.8 * Math.max(easeR, lockR) * L), 0, 1)];
}
